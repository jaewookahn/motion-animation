<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>노아의 방주 — 잉크 일러스트 (1.5x Slow, 15s)</title>
<style>
@font-face{font-family:BH;src:url(../../fonts/BlackHanSans-Regular.ttf)}
@font-face{font-family:GA;src:url(../../fonts/Gaegu-Bold.ttf)}
@font-face{font-family:NP;src:url(../../fonts/NanumPenScript-Regular.ttf)}
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
</style></head>
<body><canvas id="c"></canvas>
<script>
const W=1920,H=1080,DUR=15,SPEED=1.5;
const INK='#1C1712',TONE='#8B8072',TONE2='#BCAE96',PAPER='#E8D8BC',PAPERL='#F1E6D0',RED='#B5372A';
const RB=['#B5503F','#C98A3E','#CDAE55','#7F9A5B','#5F8299','#7A6390'];
const cv=document.getElementById('c');cv.width=W;cv.height=H;const c=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOutCubic=x=>1-Math.pow(1-x,3);
const eInOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOutBack=(x,s=1.70158)=>x<=0?0:1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const hr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
let BF=0;

// ───────── paper (world space, generated once)
const PX0=-400,PY0=-400,PW=4640,PH=2960;
const paper=document.createElement('canvas');paper.width=PW;paper.height=PH;
(function(){const p=paper.getContext('2d');p.fillStyle=PAPER;p.fillRect(0,0,PW,PH);
  for(let i=0;i<140;i++){const x=hr(i*3.1)*PW,y=hr(i*7.7)*PH,r=150+hr(i*9.9)*500;const g=p.createRadialGradient(x,y,0,x,y,r);
    const dark=hr(i*1.7)>.5;g.addColorStop(0,dark?'rgba(150,115,70,.07)':'rgba(255,248,230,.10)');g.addColorStop(1,'rgba(0,0,0,0)');p.fillStyle=g;p.fillRect(x-r,y-r,2*r,2*r);}
  p.lineCap='round';
  for(let i=0;i<9000;i++){const x=hr(i*.37)*PW,y=hr(i*.91+5)*PH,a=hr(i*1.3)*Math.PI,l=4+hr(i*2.9)*16;
    p.strokeStyle=hr(i*4.1)>.5?'rgba(120,88,50,.10)':'rgba(255,250,235,.16)';p.lineWidth=1+hr(i*5.3)*1.2;
    p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}
  for(let i=0;i<5000;i++){const x=hr(i*.53+2)*PW,y=hr(i*.77+9)*PH;p.fillStyle=`rgba(70,48,25,${.12+hr(i)*.25})`;p.fillRect(x,y,1.6+hr(i*3)*1.6,1.6+hr(i*5)*1.4);}
  for(let i=0;i<500;i++){const x=hr(i*.61+4)*PW,y=hr(i*.29+1)*PH;p.fillStyle='rgba(222,178,60,.55)';p.beginPath();p.arc(x,y,1.5+hr(i*7)*2,0,7);p.fill();}
})();

// ───────── point generators
function Lp(x1,y1,x2,y2,n=8){const o=[];for(let i=0;i<=n;i++)o.push([lerp(x1,x2,i/n),lerp(y1,y2,i/n)]);return o;}
function Qp(a,b,e,n=24){const o=[];for(let i=0;i<=n;i++){const u=i/n;o.push([lerp(lerp(a[0],b[0],u),lerp(b[0],e[0],u),u),lerp(lerp(a[1],b[1],u),lerp(b[1],e[1],u),u)]);}return o;}
function Cp(a,b,d,e,n=30){const o=[];for(let i=0;i<=n;i++){const u=i/n,v=1-u;o.push([v*v*v*a[0]+3*v*v*u*b[0]+3*v*u*u*d[0]+u*u*u*e[0],v*v*v*a[1]+3*v*v*u*b[1]+3*v*u*u*d[1]+u*u*u*e[1]]);}return o;}
function Ap(cx,cy,r,a0,a1,n=40,ry){const o=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*(ry??r)]);}return o;}
function Rp(x,y,w,h){return [...Lp(x,y,x+w,y,10),...Lp(x+w,y,x+w,y+h,8).slice(1),...Lp(x+w,y+h,x,y+h,10).slice(1),...Lp(x,y+h,x,y,8).slice(1)];}
const cat=(...a)=>a.reduce((o,p)=>o.concat(o.length?p.slice(1):p),[]);

// ───────── ink primitives (with boil)
function jit(i,seed,amp){return [(hr(i*12.99+seed*78.23+BF*37.7)-.5)*2*amp,(hr(i*39.35+seed*11.13+BF*71.3)-.5)*2*amp];}
function jp(pts,seed,amp){return pts.map((q,i)=>{const j=jit(i,seed,amp);return [q[0]+j[0],q[1]+j[1]];});}
function ink(pts,p,o={}){
  if(p<=0||pts.length<2)return;const w=o.w??5,amp=o.amp??1.3,seed=o.seed??(pts[0][0]*.13+pts[0][1]*.71);
  const P=jp(pts,seed,amp);if(o.close)P.push(P[0]);
  let L=0;const d=[];for(let i=1;i<P.length;i++){const s=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);d.push(s);L+=s;}
  let lim=L*clamp(p);c.beginPath();c.moveTo(P[0][0],P[0][1]);
  for(let i=1;i<P.length&&lim>0;i++){if(d[i-1]<=lim){c.lineTo(P[i][0],P[i][1]);lim-=d[i-1];}else{const u=lim/d[i-1];c.lineTo(lerp(P[i-1][0],P[i][0],u),lerp(P[i-1][1],P[i][1],u));lim=0;}}
  c.lineWidth=w;c.strokeStyle=o.col??INK;c.lineCap='round';c.lineJoin='round';c.stroke();
}
function fillP(pts,col,a=1,o={}){if(a<=0)return;const P=jp(pts,o.seed??(pts[0][0]*.31+pts[0][1]*.17),o.amp??1.1);
  c.save();c.globalAlpha*=a;c.beginPath();c.moveTo(P[0][0],P[0][1]);for(const q of P)c.lineTo(q[0],q[1]);c.closePath();c.fillStyle=col;c.fill();c.restore();}
function tube(pts,p,w=14){ink(pts,p,{w,amp:.8});ink(pts,p,{w:w-7,col:PAPERL,amp:.8});}
function hatch(clipPts,x0,y0,x1,y1,sp,p,o={}){
  c.save();c.beginPath();c.moveTo(clipPts[0][0],clipPts[0][1]);for(const q of clipPts)c.lineTo(q[0],q[1]);c.closePath();c.clip();
  const n=Math.ceil((x1-x0+(y1-y0))/sp);const k=Math.floor(n*clamp(p));
  for(let i=0;i<k;i++){const x=x0+i*sp;ink(Lp(x,y0,x-(y1-y0)*(o.slant??.6),y1,3),1,{w:o.w??2.4,col:o.col??INK,amp:.9,seed:i*3.3+x0});}
  c.restore();
}
function dot(x,y,r,col=INK){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=col;c.fill();}
function wipe(x,y,w,h,p,fn){if(p<=0)return;c.save();c.beginPath();c.rect(x,y,w*p,h);c.clip();fn();c.restore();}
function hand(str,x,y,size,p,o={}){
  c.save();c.font=`${size}px ${o.font??'NP'}`;c.textBaseline='alphabetic';c.textAlign='left';const w=c.measureText(str).width;
  const x0=o.align==='center'?x-w/2:x;
  wipe(x0-10,y-size*1.05,w+20,size*1.45,p,()=>{c.fillStyle=o.col??INK;c.fillText(str,x0,y);});c.restore();return w;
}
function lettering(str,x,y,size,t0,t,o={}){
  c.save();c.font=`${size}px BH`;c.textBaseline='alphabetic';c.letterSpacing=(o.ls??4)+'px';
  const chars=[...str];let acc='';const tot=c.measureText(str).width;const x0=o.align==='center'?x-tot/2:x;
  chars.forEach((ch,i)=>{const cx=c.measureText(acc).width;acc+=ch;const cw=c.measureText(ch).width;
    const p=eOutBack(prog(t,t0+i*(o.st??.09),t0+i*(o.st??.09)+.3),2.2);if(p<=0)return;
    const j=jit(i,BF*.1+i,1.6);
    c.save();c.translate(x0+cx+cw/2+j[0],y-size*.35+j[1]);c.rotate((hr(i*5.5)-.5)*.07);c.scale(p,p);c.translate(-cw/2,size*.35);
    const sd=size*.055;c.fillStyle=INK;c.fillText(ch,sd,sd);
    c.fillStyle=o.fill??PAPERL;c.fillText(ch,0,0);c.lineWidth=size*.035;c.strokeStyle=INK;c.lineJoin='round';c.strokeText(ch,0,0);
    c.restore();});
  c.restore();
}
function ribbon(x,y,w,h,p,str,size=44){
  if(p<=0)return;const e=eOutCubic(p);const ww=w*e;
  const pts=[[x,y],[x+ww,y],[x+ww-h*.28,y+h/2],[x+ww,y+h],[x,y+h],[x+h*.28,y+h/2]];
  fillP(pts,INK,1,{seed:x*.01+y,amp:1});
  c.save();c.beginPath();c.rect(x,y,ww,h);c.clip();c.font=`${size}px GA`;c.fillStyle=PAPERL;c.textBaseline='middle';c.fillText(str,x+h*.55,y+h/2+3);c.restore();
}
function badge(x,y,r,n,p){const s=eOutBack(p,2.4);if(s<=0)return;c.save();c.translate(x,y);c.scale(s,s);
  fillP(Ap(0,0,r,0,Math.PI*2,30),INK,1,{seed:n});c.font=`${r*1.2}px BH`;c.fillStyle=PAPERL;c.textAlign='center';c.textBaseline='middle';c.fillText(n,0,r*.08);c.restore();}

// ───────── characters & props (local coords, feet / bottom center at 0,0)
function noah(t,p,pose){
  const robe=[[-24,-172],[-34,-90],[-48,0],[48,0],[34,-90],[24,-172]];
  fillP(robe,TONE2,prog(p,.3,.6)*.85);
  ink(robe,prog(p,0,.45),{w:5});
  ink(Lp(-35,-104,35,-104,6),prog(p,.35,.5),{w:6});
  ink(Lp(-8,-92,-16,-6,4),prog(p,.4,.55),{w:2.5});ink(Lp(12,-86,20,-6,4),prog(p,.42,.57),{w:2.5});
  ink(Lp(-26,0,-12,0,3),prog(p,.4,.5),{w:7});ink(Lp(12,0,28,0,3),prog(p,.4,.5),{w:7});
  // arms
  const ap=prog(p,.55,.95);
  if(pose==='hammer'){
    const sw=Math.pow(Math.abs(Math.sin(t*Math.PI/.34)),.7);const a=-1.9+sw*2.2,ua=-1.1+sw*1.9;const sx=22,sy=-158;
    const ex=sx+Math.cos(ua)*34,ey=sy+Math.sin(ua)*34;const hx=ex+Math.cos(a)*36,hy=ey+Math.sin(a)*36;
    tube([[sx,sy],[ex,ey],[hx,hy]],ap,15);
    if(ap>=1){c.save();c.translate(hx,hy);c.rotate(a+Math.PI/2);ink(Lp(0,0,0,-58,3),1,{w:6});fillP([[-16,-58],[16,-58],[16,-76],[-16,-76]],INK);c.restore();}
    tube([[-20,-156],[-34,-110],[-12,-96]],ap,15);
  }else{
    const wv=Math.sin(t*9)*6;
    tube([[-22,-158],[-48,-210],[-62+wv,-262]],ap,15);tube([[22,-158],[48,-210],[62-wv,-262]],ap,15);
    if(ap>=1){dot(-62+wv,-266,8,INK);dot(62-wv,-266,8,INK);}
  }
  // head
  const hp=prog(p,.25,.6);
  fillP(Ap(0,-200,25,0,Math.PI*2,24),PAPERL,hp>0?1:0);
  ink(Ap(0,-200,25,0,Math.PI*2,24),hp,{w:5});
  fillP(cat(Ap(0,-206,30,Math.PI*1.05,Math.PI*1.95,14),[[30,-200],[34,-160],[24,-166],[22,-198],[-22,-198],[-24,-166],[-34,-160],[-30,-200]]),TONE,prog(p,.45,.6));
  ink(Ap(0,-206,30,Math.PI*1.05,Math.PI*1.95,14),prog(p,.45,.6),{w:4});
  fillP([[-24,-200],[-22,-168],[-10,-138],[0,-128],[10,-138],[22,-168],[24,-200],[14,-188],[0,-192],[-14,-188]],INK,prog(p,.5,.65));
  ink(Lp(-27,-216,27,-216,6),prog(p,.5,.62),{w:5});
  if(hp>=1){dot(-9,-205,3.4);dot(9,-205,3.4);}
}
function hullPts(){return cat(Lp(-440,-200,440,-200,20),Qp([440,-200],[410,-30],[300,0],18),Lp(300,0,-300,0,14),Qp([-300,0],[-410,-30],[-440,-200],18));}
function hullX(y){const u=clamp(-y/200);return 300+140*Math.pow(u,1.6);}
function ark(p,o={}){
  const hp=prog(p,0,.35);
  fillP(hullPts(),PAPERL,hp>0?1:0);
  fillP(hullPts(),TONE,prog(p,.85,1)*(o.tone??.55));
  ink(hullPts(),hp,{w:6,close:true});
  for(let k=1;k<4;k++){const y=-k*50,x=hullX(y)-6;ink(Lp(-x,y,x,y,14),prog(p,.28+k*.05,.45+k*.05),{w:3});}
  for(let i=-5;i<=5;i++){if(prog(p,.5,.6)>0)dot(i*70+12,-25,3.2);}
  const cab=Rp(-250,-335,500,135);fillP(cab,PAPERL,prog(p,.45,.5));ink(cab,prog(p,.45,.65),{w:5});
  const roof=[[-305,-335],[305,-335],[215,-420],[-215,-420]];fillP(roof,INK,prog(p,.62,.8));
  for(let i=-3;i<=3;i++)ink(Lp(i*62,-412,i*70,-340,3),prog(p,.72,.85),{w:3,col:PAPERL});
  [-170,-60,50,160].forEach((x,i)=>{const pp=prog(p,.75+i*.03,.85+i*.03);fillP(Rp(x-24,-305,48,46),INK,pp);});
  if(o.door!==false){const d=Rp(-225,-185,100,145);fillP(d,INK,prog(p,.85,.95));}
}
function elephant(ph,col,col2){
  [[-48,0,col2],[-24,Math.PI,col2],[30,Math.PI,col],[54,0,col]].forEach(([x,o,cl])=>{c.save();c.translate(x,-52);c.rotate(Math.sin(ph+o)*.35);c.beginPath();c.roundRect(-12,-6,24,58,10);c.fillStyle=cl;c.fill();c.restore();});
  c.fillStyle=col;c.beginPath();c.ellipse(0,-78,80,48,0,0,7);c.fill();c.beginPath();c.arc(76,-96,38,0,7);c.fill();
  c.save();c.translate(98,-88);c.rotate(-.25+Math.sin(ph)*.15);c.beginPath();c.moveTo(-10,0);c.quadraticCurveTo(-4,40,16,56);c.lineWidth=18;c.lineCap='round';c.strokeStyle=col;c.stroke();c.restore();
  c.beginPath();c.moveTo(-78,-86);c.lineTo(-96,-50);c.lineWidth=6;c.strokeStyle=col;c.stroke();
  c.beginPath();c.ellipse(52,-94,22,30,0,0,7);c.strokeStyle=PAPERL;c.lineWidth=3;c.stroke();dot(88,-104,4.5,PAPERL);
}
function giraffe(ph,col,col2){
  [[-42,0,col2],[-26,Math.PI,col2],[30,Math.PI,col],[46,0,col]].forEach(([x,o,cl])=>{c.save();c.translate(x,-92);c.rotate(Math.sin(ph+o)*.3);c.beginPath();c.roundRect(-6,-4,12,96,6);c.fillStyle=cl;c.fill();c.restore();});
  c.fillStyle=col;c.beginPath();c.ellipse(0,-104,64,32,0,0,7);c.fill();
  c.save();c.translate(42,-118);c.rotate(.42);c.beginPath();c.roundRect(-13,-104,26,112,12);c.fill();c.translate(0,-104);c.rotate(.9);c.beginPath();c.ellipse(12,0,28,15,0,0,7);c.fill();
  c.fillRect(-6,-26,5,18);c.fillRect(4,-26,5,18);dot(16,-4,3.5,PAPERL);c.restore();
  [[-30,-108,9],[-4,-98,8],[18,-112,9]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.strokeStyle=PAPERL;c.lineWidth=2.5;c.stroke();});
}
function lion(ph,col,col2,mane){
  [[-38,0,col2],[-20,Math.PI,col2],[26,Math.PI,col],[42,0,col]].forEach(([x,o,cl])=>{c.save();c.translate(x,-46);c.rotate(Math.sin(ph+o)*.4);c.beginPath();c.roundRect(-8,-4,16,48,7);c.fillStyle=cl;c.fill();c.restore();});
  c.fillStyle=col;c.beginPath();c.ellipse(0,-60,60,30,0,0,7);c.fill();
  if(mane){for(let i=0;i<12;i++){const a=i/12*Math.PI*2;c.beginPath();c.arc(56+Math.cos(a)*30,-80+Math.sin(a)*30,14,0,7);c.fill();}}
  c.beginPath();c.arc(58,-78,25,0,7);c.fill();
  c.beginPath();c.moveTo(-56,-66);c.quadraticCurveTo(-90,-60,-84,-96);c.lineWidth=5;c.strokeStyle=col;c.stroke();dot(-84,-98,8,col);
  dot(66,-84,3.5,PAPERL);
}
function dove(flap,branch){
  const body=cat(Cp([-46,4],[-20,-26],[20,-22],[34,-10],14),Cp([34,-10],[30,8],[0,18],[-46,4],14));
  fillP(body,PAPERL,1);ink(body,1,{w:4.5,close:true,amp:.8});
  fillP(Ap(30,-16,12,0,Math.PI*2,16),PAPERL,1);ink(Ap(30,-16,12,0,Math.PI*2,16),1,{w:4.5,amp:.8});
  fillP([[41,-18],[54,-13],[41,-10]],INK);dot(33,-19,2.6);
  ink([[-46,4],[-66,-6],[-62,10],[-46,4]],1,{w:4,amp:.8});
  const wy=-60*Math.cos(flap);const wing=[[-16,-12],[-6,wy-6],[14,-14]];fillP(wing,PAPERL,1);ink(wing,1,{w:4.5,close:true,amp:.8});
  ink(Lp(-8,-12,-4,wy*.6-8,2),1,{w:2.5,amp:.6});
  if(branch){ink(Lp(50,-12,96,-2,4),1,{w:3.5});[[66,-20,-.6],[80,4,.6],[94,-12,-.3]].forEach(([x,y,r])=>{const L=Ap(x,y,13,0,Math.PI*2,14,6).map(([px,py])=>{const dx=px-x,dy=py-y;return [x+dx*Math.cos(r)-dy*Math.sin(r),y+dx*Math.sin(r)+dy*Math.cos(r)];});fillP(L,TONE,1);ink(L,1,{w:2.5,close:true,amp:.6});});}
}
function curl(x,base,h,w){const r0=h*.42,cx=x+w*.55,cy=base-h+r0;const sp=[];for(let i=0;i<=40;i++){const a=-Math.PI/2+i/40*Math.PI*2.6;const r=r0*(1-i/40*.85);sp.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}
  return cat(Qp([x,base],[x+w*.12,base-h],[cx,base-h],14),sp);}
function cloudBlob(x,y,s,seed){const pts=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;const r=(1+.18*Math.sin(a*5+seed)+.08*Math.sin(a*9+seed*2))*s;pts.push([x+Math.cos(a)*r*1.7,y+Math.sin(a)*r*.8]);}return pts;}
function arrow(pts,p,col=RED,w=10){ink(pts,p,{w,col,amp:1});if(p>=1){const n=pts.length,a=pts[n-1],b=pts[n-3];const ang=Math.atan2(a[1]-b[1],a[0]-b[0]);
  ink([[a[0]-Math.cos(ang-.5)*34,a[1]-Math.sin(ang-.5)*34],a,[a[0]-Math.cos(ang+.5)*34,a[1]-Math.sin(ang+.5)*34]],1,{w,col,amp:.6});}}

// ───────── panels
const PN=[
  {x:100,y:440,t:1.25,label:'방주를 짓다'},
  {x:1330,y:440,t:2.6,label:'둘씩 둘씩'},
  {x:2560,y:440,t:3.9,label:'큰 홍수'},
  {x:2560,y:1320,t:5.3,label:'40일 밤낮'},
  {x:1330,y:1320,t:6.55,label:'비둘기와 올리브 잎'},
  {x:100,y:1320,t:7.8,label:'무지개 언약'}];
const PWD=1180,PHT=800;
function frameP(i,t){const P=PN[i],s=P.t;
  ink(Rp(P.x,P.y,PWD,PHT),prog(t,s-.25,s+.15),{w:6,seed:i*9.1});
  ink(Rp(P.x+8,P.y+8,PWD-16,PHT-16),prog(t,s-.15,s+.25),{w:2,seed:i*3.7});
  badge(P.x+60,P.y+62,34,i+1,prog(t,s,s+.3));
  ribbon(P.x+108,P.y+30,P.label.length*44+110,66,prog(t,s+.08,s+.38),P.label,46);
}
function clipPanel(i){const P=PN[i];c.beginPath();c.rect(P.x+10,P.y+10,PWD-20,PHT-20);c.clip();}
function panel1(t){const P=PN[0],s=P.t;if(t<s-.3)return;c.save();clipPanel(0);c.translate(P.x,P.y);
  ink(cat(Lp(40,650,600,646,20),Lp(600,646,1140,652,20)),prog(t,s+.1,s+.45),{w:4});
  for(let i=0;i<9;i++)ink(Lp(80+i*120,668,110+i*120,668,2),prog(t,s+.3,s+.5),{w:3});
  c.save();c.translate(690,646);c.scale(.95,.95);ark(prog(t,s+.15,s+1.05));c.restore();
