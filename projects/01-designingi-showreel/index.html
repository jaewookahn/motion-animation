<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>디자인하는AI Showreel</title>
<style>
@font-face{font-family:P;src:url(../../fonts/Pretendard-Black.otf);font-weight:900}
@font-face{font-family:P;src:url(../../fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(../../fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(../../fonts/Pretendard-SemiBold.otf);font-weight:600}
@font-face{font-family:P;src:url(../../fonts/Pretendard-Medium.otf);font-weight:500}
@font-face{font-family:M;src:url(../../fonts/HackNerdFontMono-Regular.ttf);font-weight:400}
@font-face{font-family:M;src:url(../../fonts/HackNerdFontMono-Bold.ttf);font-weight:700}
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
</style></head>
<body><canvas id="c"></canvas>
<script>
// ───────────────────────── setup
const W=1920,H=1080,DUR=15;
const C={bg:'#0A0A0C',ink:'#F3F1EA',lime:'#D4FF3A',vio:'#7B61FF',org:'#FF5B2E',card:'#141418',line:'#2A2A31',mute:'#8A8A93'};
const cv=document.getElementById('c');cv.width=W;cv.height=H;const X=cv.getContext('2d');
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return [c,c.getContext('2d')];}
const [SC,S]=mk();const [TM,T]=mk();
const G={light:false,label:''};

// ───────────────────────── math
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eInExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const eInOutExpo=x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;
const eOutCubic=x=>1-Math.pow(1-x,3);
const eInOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOutQuart=x=>1-Math.pow(1-x,4);
const eOutBack=(x,s=1.70158)=>x<=0?0:1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const hr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const f=(w,s,fam)=>fam==='M'?`${w} ${s}px M, P`:`${w} ${s}px P`;

// ───────────────────────── drawing helpers
function text(c,str,x,y,o={}){
  c.save();c.font=o.font;c.textAlign=o.align||'left';c.textBaseline=o.base||'alphabetic';
  c.letterSpacing=(o.ls||0)+'px';c.globalAlpha*=(o.alpha===undefined?1:o.alpha);
  if(o.stroke){c.lineWidth=o.stroke;c.strokeStyle=o.color;c.lineJoin='round';c.strokeText(str,x,y);}
  else{c.fillStyle=o.color;c.fillText(str,x,y);}
  c.restore();
}
const LC=new Map();
function layout(c,str,font,ls=0){
  const key=str+'|'+font+'|'+ls;if(LC.has(key))return LC.get(key);
  c.save();c.font=font;c.letterSpacing=ls+'px';
  const out=[];let acc='';
  for(const ch of [...str]){const x=c.measureText(acc).width;acc+=ch;out.push({ch,x,w:c.measureText(acc).width-x});}
  const r={chars:out,w:c.measureText(str).width-ls};c.restore();LC.set(key,r);return r;
}
function riseText(c,str,x,y,font,color,t0,t,o={}){
  const st=o.stagger??.04,du=o.dur??.45,size=o.size,ls=o.ls||0;
  const L=layout(c,str,font,ls);
  c.save();c.font=font;c.letterSpacing=ls+'px';c.textBaseline='alphabetic';c.textAlign='left';
  L.chars.forEach((ch,i)=>{
    const p=eOutExpo(prog(t,t0+i*st,t0+i*st+du));if(p<=0)return;
    c.save();c.beginPath();c.rect(x+ch.x-size*.15,y-size*1.02,ch.w+size*.3,size*1.28);c.clip();
    c.fillStyle=o.colors?o.colors[i]:color;c.fillText(ch.ch,x+ch.x,y+(1-p)*size*1.25);c.restore();
  });
  c.restore();return L;
}
function dots(c,alpha,col='#fff',sp=48,r=2){
  if(alpha<=0)return;c.save();c.globalAlpha=alpha;c.fillStyle=col;
  for(let y=sp/2;y<H;y+=sp)for(let x=sp/2;x<W;x+=sp)c.fillRect(x-r/2,y-r/2,r,r);
  c.restore();
}
function star(c,x,y,r,col){
  c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x,y,x+r,y);c.quadraticCurveTo(x,y,x,y+r);
  c.quadraticCurveTo(x,y,x-r,y);c.quadraticCurveTo(x,y,x,y-r);c.fillStyle=col;c.fill();
}
function bg(c,col){c.fillStyle=col;c.fillRect(0,0,W,H);}

// ═════════════════════════ S1 · PROMPT (0 – 2.0)
const P1='15초 쇼릴, 디자인해줘';
const keyT=i=>.22+i*.075;
function s1(c,t){
  bg(c,C.bg);dots(c,.10*eOutCubic(prog(t,0,.8)));
  const font=f(600,72);const L=layout(c,P1,font);const n=L.chars.length;
  const x0=W/2-L.w/2+30,y0=H/2+24,cy=y0-26;
  const sel=eInOutCubic(prog(t,1.42,1.6));
  const ce=eInExpo(prog(t,1.6,1.8));
  text(c,'PROMPT_01',x0,y0-120,{font:f(400,22,'M'),color:C.mute,ls:4,alpha:prog(t,.05,.3)*(1-prog(t,1.5,1.62))});
  text(c,'›',x0-64,y0,{font:f(700,72,'M'),color:C.lime,alpha:prog(t,.05,.2)*(1-prog(t,1.5,1.62))});
  // highlight → line → full frame
  if(sel>0){
    const lw=lerp((L.w+28)*sel,W+60,eInExpo(prog(t,1.66,1.86)));
    const lx=lerp(x0-14,W/2-lw/2,eInOutCubic(prog(t,1.6,1.8)));
    const lh=lerp(lerp(96,5,ce),H+60,eInExpo(prog(t,1.84,2.0)));
    c.fillStyle=C.lime;c.fillRect(t<1.6?x0-14:lx,cy-lh/2,lw,lh);
  }
  c.save();c.translate(0,cy);c.scale(1,1-ce*.98);c.translate(0,-cy);
  c.font=font;c.textBaseline='alphabetic';
  L.chars.forEach((o,i)=>{
    if(t<keyT(i))return;const p=eOutBack(prog(t,keyT(i),keyT(i)+.14),2.4);
    const inSel=sel*(L.w+28)>o.x+o.w*.5+14;
    c.save();c.translate(x0+o.x+o.w/2,y0);c.scale(.7+.3*p,.5+.5*p);c.globalAlpha=clamp(p*1.6);
    c.fillStyle=inSel?C.bg:C.ink;c.fillText(o.ch,-o.w/2,0);c.restore();
  });
  c.restore();
  const typed=L.chars.filter((o,i)=>t>=keyT(i)).length;
  const done=t>keyT(n-1)+.05;
  const cx=x0+(typed?L.chars[typed-1].x+L.chars[typed-1].w:0)+10;
  if(t>.05&&t<1.42&&(!done||Math.floor(t*4)%2===0)){c.fillStyle=C.lime;c.fillRect(cx,y0-64,9,84);}
  text(c,'↵  ENTER',W/2,y0+140,{font:f(700,22,'M'),color:C.lime,align:'center',ls:6,alpha:prog(t,1.12,1.22)*(1-prog(t,1.45,1.55))});
  G.light=t>1.9;G.label='01 / PROMPT';
}

// ═════════════════════════ S2 · IDENTITY (2.0 – 4.0)
function lockupGeom(c){
  const fs=230,font=f(900,fs);const a=layout(c,'디자인하는',font,-4),b=layout(c,'AI',font,-4);
  const gap=14,total=a.w+gap+b.w,x=W/2-total/2,y=H/2+80;
  return {fs,font,a,b,x,y,bx:x+a.w+gap};
}
function s2A(c,u){
  bg(c,C.lime);
  const fs=300,font=f(900,fs);const L=layout(c,'디자인하는',font,-6);const x=W/2-L.w/2,y=H/2+110;
  riseText(c,'디자인하는',x,y,font,C.bg,0,u,{stagger:.045,dur:.4,size:fs,ls:-6});
  text(c,'DESIGNING',x+8,y-fs-6,{font:f(700,26,'M'),color:C.bg,ls:10,alpha:prog(u,.12,.25)});
  text(c,'— WITH AI',x+L.w,y+112,{font:f(700,26,'M'),color:C.bg,align:'right',ls:6,alpha:prog(u,.2,.32)});
  c.fillStyle=C.bg;c.fillRect(x+8,y+64,(L.w-8)*eOutExpo(prog(u,.08,.5)),4);
}
function s2B(c,u){
  bg(c,C.bg);dots(c,.08);
  const g=lockupGeom(c);
  const pIn=eOutExpo(prog(u,.5,.95)),m=eInOutExpo(prog(u,1.0,1.42));
  const bigS=660/230;const s=lerp(lerp(bigS*1.45,bigS,pIn),1,m);
  const cx=lerp(W/2,g.bx+g.b.w/2,m),cy=lerp(H/2,g.y-g.fs*.36,m);
  const echo=prog(u,.5,1.35);
  c.save();c.font=g.font;c.letterSpacing='-4px';c.textBaseline='alphabetic';
  for(let k=7;k>=1;k--){
    const es=s*(1+k*.13*eOutCubic(echo));const a=(1-echo)*(.55-k*.06);if(a<=0)continue;
    c.save();c.translate(cx,cy);c.scale(es,es);c.globalAlpha=a;c.strokeStyle=k%2?C.lime:C.vio;c.lineWidth=2.2/es;
    c.strokeText('AI',-g.b.w/2,g.fs*.36);c.restore();
  }
  c.save();c.translate(cx,cy);c.scale(s,s);c.fillStyle=C.lime;c.fillText('AI',-g.b.w/2,g.fs*.36);c.restore();
  c.restore();
  riseText(c,'디자인하는',g.x,g.y,g.font,C.ink,1.2,u,{stagger:.04,dur:.42,size:g.fs,ls:-4});
  const cap='DESIGN × ARTIFICIAL INTELLIGENCE';const n=Math.floor(cap.length*prog(u,1.45,1.7));
  text(c,cap.slice(0,n),g.x+6,g.y+92,{font:f(400,26,'M'),color:C.mute,ls:6});
  text(c,'YOUTUBE · @designingi',g.bx+g.b.w,g.y+92,{font:f(700,26,'M'),color:C.lime,align:'right',ls:2,alpha:prog(u,1.55,1.7)});
}
function s2(c,t){
  const u=t-2,z=prog(u,1.72,2.0);
  c.save();
  if(z>0){const g=lockupGeom(c);const ch=g.b.chars[1];const ix=g.bx+ch.x+ch.w/2+2,iy=g.y-g.fs*.36;
    const s=1+eInExpo(z)*80;c.translate(ix,iy);c.scale(s,s);c.translate(-ix,-iy);}
  if(u<.5)s2A(c,u);
  else{const w=eInOutExpo(prog(u,.5,.78));
    if(w<1){s2A(c,u);c.save();c.beginPath();c.arc(W/2,H/2,w*1150,0,7);c.clip();s2B(c,u);c.restore();}
    else s2B(c,u);}
  c.restore();
  if(z>.82){c.globalAlpha=prog(z,.82,1);bg(c,C.lime);c.globalAlpha=1;}
  G.light=u<.62||z>.9;G.label='02 / IDENTITY';
}

// ═════════════════════════ S3 · TOOLS (4.0 – 6.5)
const TOOLS=[
  {n:'Claude',cat:'LLM · CODE · DESIGN',bg:C.lime,fg:C.bg,st:'solid'},
  {n:'Figma',cat:'UI · DESIGN SYSTEM',bg:C.bg,fg:C.ink,st:'stack'},
  {n:'GPT Images 2.0',cat:'IMAGE GENERATION',bg:C.vio,fg:C.ink,st:'solid',fs:215},
  {n:'Stitch',cat:'UI GENERATION',bg:C.ink,fg:C.bg,st:'wide'},
  {n:'Firefly',cat:'CHARACTER BRANDING',bg:C.org,fg:C.bg,st:'split'},
  {n:'Codex',cat:'BUILD · DEPLOY',bg:C.bg,fg:C.lime,st:'rows'},
  {n:'Higgsfield',cat:'AI VIDEO · MCP',bg:C.lime,fg:C.bg,st:'skew',fs:270},
];
const REEL=['Claude','Figma','GPT Images','Stitch','Firefly','Codex','Higgsfield','Newtake','Genspark','Claude','Figma','GPT Images','Stitch','Firefly','Codex','Higgsfield','Newtake','PROMPT → DESIGN'];
function s3(c,t){
  const u=t-4;if(u>=1.75)return s3reel(c,u-1.75);
  const i=Math.min(6,Math.floor(u/.25)),lu=u-i*.25,o=TOOLS[i];
  bg(c,o.bg);G.light=o.bg!==C.bg;G.label='03 / TOOLS';
  if(o.bg===C.bg)dots(c,.08);
  const fs=o.fs||330,font=f(900,fs),e=eOutExpo(prog(lu,0,.2)),sc=lerp(1.25,1,e),by=fs*.36;
  c.save();c.translate(W/2+lu*70-18,H/2);c.scale(sc,sc);
  c.font=font;c.textAlign='center';c.textBaseline='alphabetic';c.letterSpacing='-8px';c.fillStyle=o.fg;c.strokeStyle=o.fg;
  switch(o.st){
    case 'solid':c.fillText(o.n,0,by);break;
    case 'stack':c.lineWidth=3;
      for(let k=-2;k<=2;k++){if(!k)continue;c.globalAlpha=1-Math.abs(k)*.32;c.strokeText(o.n,0,by+k*fs*.82*e);}
      c.globalAlpha=1;c.fillText(o.n,0,by);break;
    case 'wide':{const ls=lerp(90,34,e);c.letterSpacing=ls+'px';c.transform(1,0,-.22,1,0,0);c.fillText(o.n.toUpperCase(),ls/2,by);break;}
    case 'split':{const d=(1-e)*420;
      c.save();c.beginPath();c.rect(-W,-H,2*W,H);c.clip();c.fillText(o.n,-d,by);c.restore();
      c.save();c.beginPath();c.rect(-W,0,2*W,H);c.clip();c.fillText(o.n,d,by);c.restore();
      c.fillRect(-W*e*.5,-2,W*e,4);break;}
    case 'rows':{const sp=fs*.8,off=(lu*900)%sp;c.lineWidth=2.5;
      for(let k=-3;k<=3;k++){const y=by+k*sp-off+sp*.5;if(k===0)continue;c.globalAlpha=.85-Math.abs(k)*.18;c.strokeText(o.n,0,y);}
      c.globalAlpha=1;c.fillText(o.n,0,by);break;}
    case 'skew':c.transform(1,0,-.28,1,0,0);c.fillText(o.n,0,by);
      for(let k=0;k<6;k++){c.globalAlpha=.35;c.fillRect(-1100+hr(k)*400,-fs*.5+k*fs*.17,300+hr(k+9)*500,6);}c.globalAlpha=1;break;
  }
  c.restore();
  text(c,`TOOL ${String(i+1).padStart(2,'0')} / 07`,140,206,{font:f(700,24,'M'),color:o.fg,ls:4});
  for(let k=0;k<7;k++){c.fillStyle=o.fg;c.globalAlpha=k<=i?1:.25;c.fillRect(140+k*34,228,24,4);}c.globalAlpha=1;
  text(c,o.cat,W-140,H-200,{font:f(700,24,'M'),color:o.fg,align:'right',ls:4});
  const sb=prog(lu,0,.14);
  if(sb>0&&sb<1){c.save();c.fillStyle=o.fg;c.translate(lerp(-300,W+300,eOutCubic(sb)),0);c.transform(1,0,-.4,1,0,0);c.fillRect(-18,0,36,H);c.restore();}
}
function reelPos(v){return eOutQuart(prog(v,0,.6))*(REEL.length-1);}
function s3reel(c,v){
  bg(c,C.bg);dots(c,.08);G.light=false;G.label='03 / TOOLS';
  const lh=200,pos=reelPos(v),spd=Math.abs(reelPos(v+.004)-reelPos(v))/.004*lh;
  const st=1+clamp(spd/9000,0,1.4);
  c.save();c.font=f(900,150);c.textAlign='center';c.letterSpacing='-4px';
  for(let k=Math.floor(pos)-4;k<=Math.floor(pos)+4;k++){
    if(k<0||k>=REEL.length)continue;const y=H/2+(k-pos)*lh,d=Math.abs(k-pos);
    c.save();c.globalAlpha=clamp(1-d*.42)/(st*.8+.2);c.fillStyle=k===REEL.length-1?C.lime:C.ink;
    c.translate(W/2,y);c.scale(1,st);c.fillText(REEL[k],0,54);c.restore();
  }
  c.restore();
  const land=eOutExpo(prog(v,.58,.75));
  c.fillStyle=C.lime;c.globalAlpha=.9;
  c.fillRect(W/2-(W/2-160)*land,H/2-lh/2,(W-320)*land,3);c.fillRect(W/2-(W/2-160)*land,H/2+lh/2,(W-320)*land,3);
  c.globalAlpha=1;
  text(c,'FROM',160,H/2-lh/2-22,{font:f(700,22,'M'),color:C.mute,ls:4,alpha:land});
  text(c,'ONE LINE OF PROMPT',W-160,H/2+lh/2+44,{font:f(700,22,'M'),color:C.lime,align:'right',ls:4,alpha:land});
}

// ═════════════════════════ S4 · SYSTEM (6.5 – 9.0)
const GX=816,GY=318,CS=42,GP=8,PITCH=CS+GP;
const HUES=[75,52,28,8,340,262,222,190,150,0];
const PERM=(()=>{const a=[...Array(200).keys()];for(let i=199;i>0;i--){const j=Math.floor(hr(i*3.7+1)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;})();
function swatch(cc,r){const h=HUES[r],l=lerp(90,14,cc/19),s=r===9?4:(r===0?95:80);return `hsl(${h},${s}%,${l}%)`;}
function uiColor(cc,r){
  if(r===0)return cc<=1?C.lime:(cc>=16?'#3A3A44':'#1E1E25');
  if(r<=5){if(cc===12)return '#0F0F12';return cc<12?(r<=2?'#8C74FF':'#7B61FF'):(r<=2?'#FF7550':C.org);}
  if(r===6)return '#0F0F12';
  const inCard=cc<=5||(cc>=7&&cc<=12)||cc>=14;if(!inCard)return '#0F0F12';
  if(r===9&&[1,2,8,9,15,16].includes(cc))return C.lime;
  return '#24242C';
}
const appearT=(cc,r)=>.5+(cc+r)*.026;
const PL=['디자인 토큰 200개로','랜딩 페이지 만들어줘'];
function cursor(c,x,y,label,col){
  c.save();c.translate(x,y);c.beginPath();c.moveTo(0,0);c.lineTo(0,34);c.lineTo(9,26);c.lineTo(16,41);c.lineTo(22,38);c.lineTo(15,23);c.lineTo(27,23);c.closePath();
  c.fillStyle=C.ink;c.strokeStyle=C.bg;c.lineWidth=2.5;c.fill();c.stroke();
  c.font=f(700,20,'M');const w=c.measureText(label).width+24;c.beginPath();c.roundRect(22,44,w,34,17);c.fillStyle=col;c.fill();
  c.fillStyle=C.bg;c.fillText(label,34,67);c.restore();
}
function s4(c,t){
  const u=t-6.5;bg(c,C.bg);dots(c,.09);G.light=false;G.label='04 / SYSTEM';
  // prompt card
  const pc=eOutExpo(prog(u,0,.45)),px=lerp(20,110,pc);
  c.save();c.globalAlpha=pc;
  c.beginPath();c.roundRect(px,330,600,420,28);c.fillStyle=C.card;c.fill();c.strokeStyle=C.line;c.lineWidth=2;c.stroke();
  ['#FF5F57','#FEBC2E','#28C840'].forEach((col,i)=>{c.fillStyle=col;c.beginPath();c.arc(px+40+i*26,372,7,0,7);c.fill();});
  text(c,'claude — prompt',px+564,379,{font:f(400,20,'M'),color:C.mute,align:'right'});
  c.fillStyle=C.line;c.fillRect(px,402,600,2);
  let k=0,lastX=px+44,lastY=490;
  PL.forEach((ln,li)=>{const L=layout(c,ln,f(700,46));const y=490+li*66;
    L.chars.forEach(o=>{const tt=.25+k*.032;k++;if(u<tt)return;text(c,o.ch,px+44+o.x,y,{font:f(700,46),color:C.ink,alpha:prog(u,tt,tt+.05)});lastX=px+44+o.x+o.w;lastY=y;});});
  if(u<1.05&&Math.floor(u*5)%2===0){c.fillStyle=C.lime;c.fillRect(lastX+6,lastY-40,6,50);}
  const press=u>1.05&&u<1.17?.92:1;
  c.save();c.translate(px+44+120,672);c.scale(press,press);c.beginPath();c.roundRect(-120,-32,240,64,32);c.fillStyle=C.lime;c.fill();
  text(c,'GENERATE  ⏎',0,9,{font:f(700,24,'M'),color:C.bg,align:'center',ls:2});c.restore();
  if(u>1.05){const r=eOutExpo(prog(u,1.05,1.5));c.strokeStyle=C.lime;c.globalAlpha=pc*(1-r);c.lineWidth=3;c.beginPath();c.roundRect(px+44-r*20,640-r*20,240+r*40,64+r*40,32+r*20);c.stroke();c.globalAlpha=pc;}
  text(c,'✓ 200 tokens',px+310,682,{font:f(700,22,'M'),color:C.lime,alpha:prog(u,1.3,1.45)});
  c.restore();
  // counter
  let count=0;for(let r=0;r<10;r++)for(let cc=0;cc<20;cc++)if(u>=appearT(cc,r))count++;
  const ca=prog(u,.45,.6)*(1-prog(u,1.35,1.55));
  text(c,String(count).padStart(3,'0'),GX-6,GY-38,{font:f(900,120),color:C.ink,ls:-4,alpha:ca});
  text(c,'DESIGN TOKENS',GX+250,GY-110,{font:f(700,22,'M'),color:C.lime,ls:4,alpha:ca});

  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,dx,dy])=>{c.beginPath();c.moveTo(x+dx*l,y);c.lineTo(x,y);c.lineTo(x,y+dy*l);c.stroke();});
  c.font=f(700,17,'M');c.letterSpacing='3px';c.textBaseline='middle';
  c.textAlign='left';c.fillText('DESIGNINGI — SHOWREEL 2026',96,84);
  c.textAlign='right';c.fillText(G.label,W-96,84);
  const fr=Math.floor(t*60+1e-6);const tc=`00:00:${String(Math.floor(fr/60)).padStart(2,'0')}:${String(fr%60).padStart(2,'0')}`;
  c.fillText(tc,W-96,H-84);
  c.textAlign='left';c.fillText('REC   1920×1080 · 60P',120,H-84);
  if(Math.floor(t*2)%2===0){c.fillStyle='#FF3B30';c.beginPath();c.arc(103,H-85,6,0,7);c.fill();c.fillStyle=col;}
  c.globalAlpha=a*.3;c.fillRect(96,H-60,W-192,2);c.globalAlpha=a;c.fillRect(96,H-60,(W-192)*clamp(t/DUR),2);
  c.restore();
}
