<body><canvas id="c"></canvas>
<script>
// 다니엘 6장 · 15초 · 지상 바빌론 + 지하 사자굴 단면도 디오라마 (v2: 오브젝트·디테일 강화)
const W=1920,H=1080,DUR=15;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const c=cv.getContext('2d');
// ── math
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOut=x=>1-Math.pow(1-x,3);
const eBack=(x,s=1.70158)=>x<=0?0:1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const hr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixC=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t))).toString(16).padStart(2,'0')).join('');};
const f=(w,s)=>`${w} ${s}px P`;
// ── paint helpers
function lg(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;}
function rg(x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;}
function rr(x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();}
function circ(x,y,r,fill){c.beginPath();c.arc(x,y,Math.max(.1,r),0,Math.PI*2);c.fillStyle=fill;c.fill();}
function ell(x,y,rx,ry,fill,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2);c.fillStyle=fill;c.fill();}
function poly(pts,fill){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill();}
function line(pts,w,col){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.lineWidth=w;c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';c.stroke();}
function glow(x,y,r,col,a=1){if(a<=0)return;c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;c.fillStyle=rg(x,y,r,[[0,col],[1,'rgba(0,0,0,0)']]);c.fillRect(x-r,y-r,2*r,2*r);c.restore();}
function shadowE(x,y,rx,ry=rx*.18,a=.25){ell(x,y,rx,ry,`rgba(10,5,25,${a})`);}
function rock(x,y,r,seed,c1,c2){const pts=[];const n=7;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+seed;const rr_=r*(.75+hr(seed*9+i)*.35);pts.push([x+Math.cos(a)*rr_,y+Math.sin(a)*rr_*.75]);}
  poly(pts,c2);c.save();c.beginPath();pts.forEach(([px,py],i)=>i?c.lineTo(px,py):c.moveTo(px,py));c.closePath();c.clip();ell(x-r*.15,y-r*.35,r*.9,r*.5,c1);c.restore();}

// ═════════ palette
const K={
  skyDuskT:'#1C1A4F',skyDuskM:'#7B3F8F',skyDuskB:'#F59460',skyNightT:'#0A0C2A',skyNightM:'#18205A',skyNightB:'#2E3A7A',skyDawnT:'#2D4C8F',skyDawnM:'#E7867A',skyDawnB:'#FFD49A',
  sand:'#E8B66E',sandD:'#C58744',sandL:'#F7D394',wallB:'#6B4C93',wallB2:'#4A3675',
  soil1:'#7A4B35',soil2:'#633B2C',soil3:'#4E2E25',soil4:'#3A221E',caveRim:'#2B1A2A',
  lion:'#F2A541',lionD:'#D4822B',mane:'#C9612D',maneD:'#93401F',lionFace:'#F7C064',muzzle:'#FCE4B4',
  danRobe:'#3F7FC0',danRobeD:'#2A5A93',gold:'#F4C24E',skin:'#F2C29C',skinD:'#DCA47E',beardW:'#EEE9DF',wrap:'#EEE5D2',
  kingRobe:'#7D44A8',kingRobeD:'#57297A',beardK:'#3B2A22',tile:'#2B5FB4',tileD:'#1C3F86',
  leaf:'#3E8A5C',leafD:'#2F7049',leafL:'#58A673',wood:'#8A5A34',woodD:'#6B4226',
  ink:'#1E1630',cream:'#FFF6E6',red:'#D9412F'};
const night=t=>prog(t,4.6,5.6)*(1-prog(t,10.2,11.6));
const dawnF=t=>prog(t,10.2,11.6);
function skyStops(t){const n=prog(t,4.6,5.6),d=dawnF(t);
  return ['T','M','B'].map(k=>mixC(mixC(K['skyDusk'+k],K['skyNight'+k],n),K['skyDawn'+k],d));}

// ═════════ world geometry
const GY=2000;
const DEN={x:1950,y:2760,rx:760,ry:380,floor:3060};
const SHAFT={x:1950,w:230,top:GY,bot:2420};
const HOUSE={x:900,w:470,h:400};
const WIN={x:900,y:1720,w:190,h:220};
const PAL={x:2950};
let curT=0;

// ═════════ characters
function person(o,t){
  const s=o.s||1;c.save();c.translate(o.x,o.y);c.scale((o.flip?-1:1)*s,s);
  const pose=o.pose||'stand';const kneel=pose==='kneel';const walk=pose==='run'||pose==='walk';
  const sp=pose==='run'?16:7;const bob=walk?Math.abs(Math.sin(t*sp+(o.ph||0)))*(pose==='run'?-8:-4):0;
  c.translate(0,bob);
  if(!o.noShadow)shadowE(0,-bob,52);
  const bh=kneel?78:122,bw=76,sy=-bh+20;
  const sleeve=o.robeD;
  const arm=(x0,y0,x1,y1)=>{line([[x0,y0],[x1,y1]],19,sleeve);line([[lerp(x0,x1,.82),lerp(y0,y1,.82)],[x1,y1]],19,mixC(sleeve,'#FFFFFF',.18));circ(x1,y1,9.5,K.skin);};
  if(!kneel){const st=walk?Math.sin(t*sp+(o.ph||0))*10:0;ell(-14+st,-3,15,6,'#4A3020');ell(16-st,-3,15,6,'#4A3020');}
  if(o.cape){c.fillStyle=lg(0,-bh,0,0,[[0,o.cape],[1,mixC(o.cape,'#000000',.3)]]);c.beginPath();c.moveTo(-30,-bh+14);c.quadraticCurveTo(-62,-50,-58,-2);c.lineTo(10,-2);c.lineTo(20,-bh+14);c.fill();}
  if(pose==='raise')arm(-24,sy,-56,-bh-62);
  if(walk){const sw=Math.sin(t*sp+(o.ph||0))*26;arm(-20,sy,-30-sw,sy+52);}
  if(kneel)rr(-54,-36,86,36,18,o.robeD);
  c.save();c.beginPath();c.roundRect(-bw/2,-bh,bw,bh,[34,34,16,16]);c.clip();
  c.fillStyle=lg(0,-bh,0,0,[[0,o.robe],[1,o.robeD]]);c.fillRect(-bw/2,-bh,bw,bh);
  if(o.pattern){for(let r=0;r<6;r++)for(let k=0;k<4;k++){const px=-bw/2+10+k*20+(r%2)*10,py=-bh+22+r*18;poly([[px,py-5],[px+5,py],[px,py+5],[px-5,py]],o.pattern);}}
  c.fillStyle='rgba(255,255,255,.14)';c.fillRect(-bw/2+8,-bh+10,13,bh-30);
  c.fillStyle='rgba(0,0,0,.12)';c.fillRect(bw/2-14,-bh,14,bh);

  if(pose==='stand')arm(24,sy,36,sy+62);
  if(pose==='kneel')arm(22,sy,44,-bh-36);
  if(pose==='raise')arm(24,sy,56,-bh-62);
  if(pose==='point'){arm(24,sy,86,sy-10);if(o.sceptre){line([[86,sy-10],[96,sy-80]],7,K.gold);circ(96,sy-86,11,K.gold);circ(96,sy-86,5,K.red);}}
  if(walk){const sw=Math.sin(t*sp+(o.ph||0))*26;arm(20,sy,30+sw,sy+52);}
  if(pose==='whisper')arm(24,sy,38,-bh-24);
  if(pose==='spear'){line([[44,0],[44,-bh-120]],6,K.woodD);poly([[44,-bh-150],[54,-bh-118],[34,-bh-118]],'#C9D2DC');arm(24,sy,44,sy+20);}
  const hy=-bh-30,lk=o.look??5;
  c.fillStyle=lg(0,hy-34,0,hy+34,[[0,K.skin],[1,K.skinD]]);c.beginPath();c.arc(0,hy,34,0,Math.PI*2);c.fill();
  ell(-32,hy+2,7,10,K.skinD);
  circ(-10+lk,hy+12,7,'rgba(240,120,110,.28)');circ(22+lk,hy+12,6,'rgba(240,120,110,.28)');
  if(o.beard){c.beginPath();c.moveTo(-26,hy+6);c.quadraticCurveTo(-24,hy+52,6,hy+(o.beardLong?66:46));c.quadraticCurveTo(30,hy+40,30,hy+4);c.quadraticCurveTo(4,hy+18,-26,hy+6);c.fillStyle=o.beard;c.fill();
    if(o.curly){for(let r=0;r<3;r++)for(let k=0;k<4-r;k++)circ(-14+k*12+r*6,hy+22+r*12,5,mixC(o.beard,'#000000',.25));}
    c.strokeStyle=mixC(o.beard,'#FFFFFF',.2);c.lineWidth=2;c.beginPath();c.moveTo(-4,hy+30);c.lineTo(0,hy+(o.beardLong?56:38));c.moveTo(12,hy+26);c.lineTo(14,hy+44);c.stroke();}
  if(o.wrap){c.beginPath();c.arc(0,hy-2,37,Math.PI*1.02,Math.PI*1.98);c.lineTo(37,hy-6);c.lineTo(-37,hy-6);c.fillStyle=o.wrap;c.fill();rr(-39,hy-14,78,10,5,o.wrapBand||K.gold);
    c.beginPath();c.moveTo(-36,hy-6);c.quadraticCurveTo(-52,hy+30,-40,hy+56);c.lineTo(-30,hy+10);c.fillStyle=mixC(o.wrap,'#000000',.08);c.fill();}
  if(o.crown){poly([[-30,hy-26],[-30,hy-58],[-15,hy-44],[0,hy-64],[15,hy-44],[30,hy-58],[30,hy-26]],K.gold);circ(0,hy-52,5,K.red);circ(-30,hy-58,4,'#FFF2B0');circ(30,hy-58,4,'#FFF2B0');c.fillStyle='rgba(0,0,0,.12)';c.fillRect(-30,hy-34,60,8);}
  if(o.hat){rr(-26,hy-84,52,60,[22,22,4,4],o.hat);c.fillStyle=K.gold;c.fillRect(-26,hy-40,52,7);}
  if(o.helmet){c.beginPath();c.arc(0,hy-8,37,Math.PI,0);c.fillStyle='#9AA6B4';c.fill();poly([[-4,hy-44],[0,hy-70],[4,hy-44]],K.red);}
  const ey=hy-4,bl=o.blink??1;
  c.strokeStyle=o.beard&&o.beard!==K.beardW?o.beard:'#8A8278';c.lineWidth=3.5;c.lineCap='round';
  [-9,13].forEach(x=>{c.beginPath();c.moveTo(x+lk-6,ey-13+(o.eyes==='sly'?3:0));c.lineTo(x+lk+6,ey-14-(o.eyes==='sly'?2:0));c.stroke();});
  if(o.eyes==='closed'){c.strokeStyle=K.ink;c.lineWidth=3.5;[-9,13].forEach(x=>{c.beginPath();c.arc(x+lk*.5,ey,6,.15*Math.PI,.85*Math.PI);c.stroke();});}
  else{[-9,13].forEach(x=>{ell(x+lk,ey,5,7*bl,K.ink);if(bl>.5)circ(x+lk+1.8,ey-2.5,1.8,'#fff');});
    if(o.eyes==='sly'){c.fillStyle=K.skin;c.fillRect(-20+lk,ey-10,42,8);}}
  if(o.mouth==='o')ell(10+lk,hy+16,5,6,K.ink);
  if(o.jar){ell(0,hy-50,24,22,'#C46A3C');rr(-10,hy-80,20,14,4,'#A85530');}
  c.restore();
}
function lion(o,t){
  const s=o.s||1;c.save();c.translate(o.x,o.y);c.scale((o.flip?-1:1)*s,s);
  const lie=clamp(o.lie||0);shadowE(-10,0,120,16,.3);c.translate(0,lie*22);
  const tw=Math.sin(t*3+o.x)*.3*(1-lie);
  line([[-96,-66],[-128,-62+tw*40],[-150,-108+tw*30]],11,K.lionD);circ(-150,-112+tw*30,14,K.maneD);circ(-154,-116+tw*30,6,K.mane);
  if(lie<1)[[-80,K.lionD],[-50,K.lionD],[22,K.lion],[50,K.lion]].forEach(([x,col])=>{rr(x-12,-34,24,34*(1-lie)+6,10,col);c.strokeStyle='rgba(90,40,20,.4)';c.lineWidth=2;for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(x+k*6,4-lie*30);c.lineTo(x+k*6,-2-lie*30);c.stroke();}});
  c.fillStyle=lg(0,-96,0,-14,[[0,K.lionFace],[1,K.lionD]]);c.beginPath();c.roundRect(-104,-96,182,82,40);c.fill();
  ell(-10,-26,70,12,'rgba(255,230,180,.35)');ell(-40,-80,30,8,'rgba(255,255,255,.18)');
  const hx=70,hy=-104;c.save();c.translate(hx,hy);c.rotate(lie*.18);
  const star=(r1,r2,n,col)=>{c.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,r=i%2?r1:r2;i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fillStyle=col;c.fill();};
  star(64,88,10,K.maneD);star(54,72,10,K.mane);
  circ(-24,-42,14,K.lionD);circ(28,-44,14,K.lionD);circ(-24,-42,7,'#E88A7A');circ(28,-44,7,'#E88A7A');
  c.fillStyle=lg(0,-44,0,44,[[0,K.lionFace],[1,K.lion]]);c.beginPath();c.arc(4,2,46,0,Math.PI*2);c.fill();
  ell(18,22,30,20,K.muzzle);poly([[8,8],[30,8],[19,20]],'#5A2E1E');ell(15,10,4,2,'rgba(255,255,255,.4)');
  [[4,24],[0,30],[34,24],[38,30]].forEach(([x,y])=>circ(x,y,1.8,'#B07A50'));
  c.strokeStyle='#A0561F';c.lineWidth=4;c.lineCap='round';[[-10,-8],[30,-10]].forEach(([x,y])=>{c.beginPath();c.moveTo(x-8,y-14);c.lineTo(x+7,y-17+(o.mouth>.3?4:0));c.stroke();});
  if(o.eyes==='closed'){c.strokeStyle='#5A2E1E';c.lineWidth=4;[[-10,-8],[30,-10]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,7,.1*Math.PI,.9*Math.PI);c.stroke();});}
  else if(!o.hideEyes){[[-10,-8],[30,-10]].forEach(([x,y])=>{ell(x,y,8,9,'#FFF6D8');circ(x+3,y+1,4.5,K.ink);circ(x+4.5,y-1,1.5,'#fff');});}
  const m=clamp(o.mouth||0);
  if(m>.05){ell(19,36,17,16*m,'#5A1E22');ell(19,40+8*m,9,5*m,'#C8505A');poly([[7,36-14*m],[11,36-4*m],[14,36-14*m]],'#fff');poly([[24,36-14*m],[28,36-4*m],[31,36-14*m]],'#fff');}
  else{c.strokeStyle='#5A2E1E';c.lineWidth=3;c.beginPath();c.arc(13,30,6,.1*Math.PI,.9*Math.PI);c.arc(25,30,6,.1*Math.PI,.9*Math.PI);c.stroke();}
  c.restore();c.restore();
  return {ex:o.x+(o.flip?-1:1)*s*(hx+10),ey:o.y+s*(hy-8+lie*22)};
}
function angel(x,y,a,t){
  if(a<=0)return;c.save();c.globalAlpha=a;
  glow(x,y-120,620,'rgba(255,236,190,.55)');glow(x,y-130,260,'rgba(255,250,235,.9)');
  for(let side=-1;side<=1;side+=2)for(let k=0;k<5;k++){const sp=Math.sin(t*2+k)*.05;c.save();c.translate(x+side*30,y-170);c.rotate(side*(.5+k*.24+sp));
    c.globalAlpha=a*(.45-k*.07);poly([[0,0],[0,-250+k*22],[side*62,-125]],k%2?'#FFF4D6':'#FFE7B0');c.restore();}
  c.globalAlpha=a;
  c.fillStyle=lg(x,y-260,x,y,[[0,'#FFFFFF'],[1,'#FFE3A3']]);c.beginPath();c.roundRect(x-44,y-220,88,220,[44,44,24,24]);c.fill();
  c.fillStyle='rgba(255,215,140,.6)';c.fillRect(x-44,y-120,88,8);
  circ(x,y-262,36,'#FFFDF5');
  c.strokeStyle='#FFE08A';c.lineWidth=7;c.beginPath();c.ellipse(x,y-318,42,11,0,0,Math.PI*2);c.stroke();
  for(let i=0;i<24;i++){const ph=t*.9+i/24*Math.PI*2;const r=140+Math.sin(t*1.7+i)*30;circ(x+Math.cos(ph)*r,y-150+Math.sin(ph)*r*.5,2+hr(i)*3.5,'#FFF6D8');}
  c.restore();
}
function camel(x,t,dir){
  c.save();c.translate(x,GY);c.scale(dir,1);const ph=t*5;shadowE(0,0,110,14,.25);
  [[-60,0],[-36,Math.PI],[40,Math.PI],[64,0]].forEach(([lx,o])=>{c.save();c.translate(lx,-110);c.rotate(Math.sin(ph+o)*.28);rr(-7,0,14,112,7,'#B9824E');c.restore();});
  ell(0,-130,90,42,'#D19A5E');circ(-10,-170,40,'#D19A5E');ell(0,-120,70,14,'rgba(255,255,255,.12)');
  rr(-46,-176,92,36,10,K.red);for(let k=0;k<4;k++){c.fillStyle=K.gold;c.fillRect(-46+k*24,-176,8,36);}
  line([[78,-140],[118,-210]],30,'#D19A5E');ell(132,-216,30,18,'#D19A5E');circ(140,-222,3.5,K.ink);ell(118,-232,6,9,'#B9824E');

  c.restore();
}
function stall(x,i,t){
  const cols=[[K.red,'#F5E6C8'],['#2F8F83','#F5E6C8'],['#E0A030','#7A3E2A']][i%3];
  line([[x,GY],[x,GY-200]],8,K.woodD);line([[x+240,GY],[x+240,GY-200]],8,K.woodD);
  for(let k=0;k<6;k++){poly([[x-10+k*44,GY-230],[x+34+k*44,GY-230],[x+34+k*44,GY-180],[x-10+k*44,GY-180]],shade(k%2?cols[0]:cols[1],t));
    c.beginPath();c.arc(x+12+k*44,GY-180,22,0,Math.PI);c.fillStyle=shade(k%2?cols[0]:cols[1],t);c.fill();}
  rr(x-6,GY-90,252,90,6,shade(K.wood,t));c.fillStyle='rgba(0,0,0,.15)';c.fillRect(x-6,GY-30,252,30);
  const fr=['#F28C28','#C93A3A','#8BBF4A','#E8C547'];for(let k=0;k<9;k++){circ(x+20+k*26,GY-100-(k%2)*10,13,shade(fr[(k+i)%4],t,.5));circ(x+16+k*26,GY-104-(k%2)*10,4,'rgba(255,255,255,.35)');}
  ell(x+40,GY-30,22,26,shade('#C46A3C',t));ell(x+200,GY-34,26,30,shade('#A85530',t));
}
function lantern(x,t){
  const n=night(t);line([[x,GY],[x,GY-230]],7,'#4A3A44');line([[x,GY-230],[x+40,GY-230]],5,'#4A3A44');
  rr(x+26,GY-226,30,40,6,'#5A4A54');const fl=.8+.2*Math.sin(t*23+x)*Math.sin(t*7+x);
  rr(x+31,GY-220,20,28,4,mixC('#8A6A4A','#FFD27A',clamp(n*1.5+.3)));glow(x+41,GY-206,160*fl,'rgba(255,190,90,.55)',.15+n*.85);
}
