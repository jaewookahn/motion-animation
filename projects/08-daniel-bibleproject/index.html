<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다니엘 — 바이블프로젝트 잉크 인포그래픽 스타일</title>
<style>
@font-face { font-family: BH; src: url(../../fonts/BlackHanSans-Regular.ttf); }
@font-face { font-family: GA; src: url(../../fonts/Gaegu-Bold.ttf); }
@font-face { font-family: NP; src: url(../../fonts/NanumPenScript-Regular.ttf); }
html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1920, H = 1080, DUR = 15.0;
const INK = '#1C1712', TONE = '#8B8072', TONE2 = '#BCAE96', PAPER = '#E8D8BC', PAPERL = '#F1E6D0', RED = '#B5372A';
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = (x, s = 1.7) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const hr = i => {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
};
let BF = 0;

// ───────── Kraft Paper Texture (World Space Canvas)
const PX0 = -400, PY0 = -400, PW = 4640, PH = 2960;
const paper = document.createElement('canvas');
paper.width = PW; paper.height = PH;
(function() {
  const p = paper.getContext('2d');
  p.fillStyle = PAPER;
  p.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 140; i++) {
    const x = hr(i * 3.1) * PW, y = hr(i * 7.7) * PH, r = 150 + hr(i * 9.9) * 500;
    const g = p.createRadialGradient(x, y, 0, x, y, r);
    const dark = hr(i * 1.7) > 0.5;
    g.addColorStop(0, dark ? 'rgba(150,115,70,.07)' : 'rgba(255,248,230,.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = g;
    p.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  p.lineCap = 'round';
  for (let i = 0; i < 9000; i++) {
    const x = hr(i * 0.37) * PW, y = hr(i * 0.91 + 5) * PH, a = hr(i * 1.3) * Math.PI, l = 4 + hr(i * 2.9) * 16;
    p.strokeStyle = hr(i * 4.1) > 0.5 ? 'rgba(120,88,50,.10)' : 'rgba(255,250,235,.16)';
    p.lineWidth = 1 + hr(i * 5.3) * 1.2;
    p.beginPath(); p.moveTo(x, y); p.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
  for (let i = 0; i < 5000; i++) {
    const x = hr(i * 0.53 + 2) * PW, y = hr(i * 0.77 + 9) * PH;
    p.fillStyle = `rgba(70,48,25,${0.12 + hr(i) * 0.25})`;
    p.fillRect(x, y, 1.6 + hr(i * 3) * 1.6, 1.6 + hr(i * 5) * 1.4);
  }
  for (let i = 0; i < 500; i++) {
    const x = hr(i * 0.61 + 4) * PW, y = hr(i * 0.29 + 1) * PH;
    p.fillStyle = 'rgba(222,178,60,.55)';
    p.beginPath(); p.arc(x, y, 1.5 + hr(i * 7) * 2, 0, 7); p.fill();
  }
})();

// ───────── Point & Curve Generators
function Lp(x1, y1, x2, y2, n = 8) {
  const o = [];
  for (let i = 0; i <= n; i++) o.push([lerp(x1, x2, i / n), lerp(y1, y2, i / n)]);
  return o;
}
function Qp(a, b, e, n = 24) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    o.push([lerp(lerp(a[0], b[0], u), lerp(b[0], e[0], u), u), lerp(lerp(a[1], b[1], u), lerp(b[1], e[1], u), u)]);
  }
  return o;
}
function Cp(a, b, d, e, n = 30) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    o.push([v*v*v*a[0] + 3*v*v*u*b[0] + 3*v*u*u*d[0] + u*u*u*e[0], v*v*v*a[1] + 3*v*v*u*b[1] + 3*v*u*u*d[1] + u*u*u*e[1]]);
  }
  return o;
}
function Ap(cx, cy, r, a0, a1, n = 40, ry) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const a = lerp(a0, a1, i / n);
    o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * (ry ?? r)]);
  }
  return o;
}
function Rp(x, y, w, h) {
  return [...Lp(x, y, x + w, y, 10), ...Lp(x + w, y, x + w, y + h, 8).slice(1), ...Lp(x + w, y + h, x, y + h, 10).slice(1), ...Lp(x, y + h, x, y, 8).slice(1)];
}
const cat = (...a) => a.reduce((o, p) => o.concat(o.length ? p.slice(1) : p), []);

// ───────── Ink Primitives (with 12Hz Handcrafted Boil)
function jit(i, seed, amp) {
  return [(hr(i * 12.99 + seed * 78.23 + BF * 37.7) - 0.5) * 2 * amp, (hr(i * 39.35 + seed * 11.13 + BF * 71.3) - 0.5) * 2 * amp];
}
function jp(pts, seed, amp) {
  return pts.map((q, i) => {
    const j = jit(i, seed, amp);
    return [q[0] + j[0], q[1] + j[1]];
  });
}
function ink(pts, p, o = {}) {
  if (p <= 0 || pts.length < 2) return;
  const w = o.w ?? 5, amp = o.amp ?? 1.3, seed = o.seed ?? (pts[0][0] * 0.13 + pts[0][1] * 0.71);
  const P = jp(pts, seed, amp);
  if (o.close) P.push(P[0]);
  let L = 0;
  const d = [];
  for (let i = 1; i < P.length; i++) {
    const s = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
    d.push(s); L += s;
  }
  let lim = L * clamp(p);
  c.beginPath();
  c.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && lim > 0; i++) {
    if (d[i - 1] <= lim) {
      c.lineTo(P[i][0], P[i][1]);
      lim -= d[i - 1];
    } else {
      const u = lim / d[i - 1];
      c.lineTo(lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u));
      lim = 0;
    }
  }
  c.lineWidth = w;
  c.strokeStyle = o.col ?? INK;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.stroke();
}
function fillP(pts, col, a = 1, o = {}) {
  if (a <= 0) return;
  const P = jp(pts, o.seed ?? (pts[0][0] * 0.31 + pts[0][1] * 0.17), o.amp ?? 1.1);
  c.save();
  c.globalAlpha *= a;
  c.beginPath();
  c.moveTo(P[0][0], P[0][1]);
  for (const q of P) c.lineTo(q[0], q[1]);
  c.closePath();
  c.fillStyle = col;
  c.fill();
  c.restore();
}
function hatch(clipPts, x0, y0, x1, y1, sp, p, o = {}) {
  c.save();
  c.beginPath();
  c.moveTo(clipPts[0][0], clipPts[0][1]);
  for (const q of clipPts) c.lineTo(q[0], q[1]);
  c.closePath();
  c.clip();
  const n = Math.ceil((x1 - x0 + (y1 - y0)) / sp);
  const k = Math.floor(n * clamp(p));
  for (let i = 0; i < k; i++) {
    const x = x0 + i * sp;
    ink(Lp(x, y0, x - (y1 - y0) * (o.slant ?? 0.6), y1, 3), 1, {
      w: o.w ?? 2.4, col: o.col ?? INK, amp: 0.9, seed: i * 3.3 + x0
    });
  }
  c.restore();
}
function dot(x, y, r, col = INK) {
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = col;
  c.fill();
}
function wipe(x, y, w, h, p, fn) {
  if (p <= 0) return;
  c.save();
  c.beginPath();
  c.rect(x, y, w * p, h);
  c.clip();
  fn();
  c.restore();
}
function hand(str, x, y, size, p, o = {}) {
  c.save();
  c.font = `${size}px ${o.font ?? 'NP'}`;
  c.textBaseline = 'alphabetic';
  c.textAlign = 'left';
  const w = c.measureText(str).width;
  const x0 = o.align === 'center' ? x - w / 2 : x;
  wipe(x0 - 10, y - size * 1.05, w + 20, size * 1.45, p, () => {
    c.fillStyle = o.col ?? INK;
    c.fillText(str, x0, y);
  });
  c.restore();
  return w;
}
function lettering(str, x, y, size, t0, t, o = {}) {
  c.save();
  c.font = `${size}px BH`;
  c.textBaseline = 'alphabetic';
  c.letterSpacing = (o.ls ?? 4) + 'px';
  const chars = [...str];
  let acc = '';
  const tot = c.measureText(str).width;
  const x0 = o.align === 'center' ? x - tot / 2 : x;
  chars.forEach((ch, i) => {
    const cx = c.measureText(acc).width;
    acc += ch;
    const cw = c.measureText(ch).width;
    const p = eOutBack(prog(t, t0 + i * (o.st ?? 0.09), t0 + i * (o.st ?? 0.09) + 0.3), 2.2);
    if (p <= 0) return;
    const j = jit(i, BF * 0.1 + i, 1.6);
    c.save();
    c.translate(x0 + cx + cw / 2 + j[0], y - size * 0.35 + j[1]);
    c.rotate((hr(i * 5.5) - 0.5) * 0.07);
    c.scale(p, p);
    c.translate(-cw / 2, size * 0.35);
    const sd = size * 0.055;
    c.fillStyle = INK;
    c.fillText(ch, sd, sd);
    c.fillStyle = o.fill ?? PAPERL;
    c.fillText(ch, 0, 0);
    c.lineWidth = size * 0.035;
    c.strokeStyle = INK;
    c.lineJoin = 'round';
    c.strokeText(ch, 0, 0);
    c.restore();
  });
  c.restore();
}
function ribbon(x, y, w, h, p, str, size = 44) {
  if (p <= 0) return;
  const e = eOutCubic(p);
  const ww = w * e;
  const pts = [[x, y], [x + ww, y], [x + ww - h * 0.28, y + h / 2], [x + ww, y + h], [x, y + h], [x + h * 0.28, y + h / 2]];
  fillP(pts, INK, 1, { seed: x * 0.01 + y, amp: 1 });
  c.save();
  c.beginPath();
  c.rect(x, y, ww, h);
  c.clip();
  c.font = `${size}px GA`;
  c.fillStyle = PAPERL;
  c.textBaseline = 'middle';
  c.fillText(str, x + h * 0.55, y + h / 2 + 3);
  c.restore();
}
function badge(x, y, r, n, p) {
  const s = eOutBack(p, 2.4);
  if (s <= 0) return;
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  fillP(Ap(0, 0, r, 0, Math.PI * 2, 30), INK, 1, { seed: n });
  c.font = `${r * 1.2}px BH`;
  c.fillStyle = PAPERL;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(n, 0, r * 0.08);
  c.restore();
}
function arrow(pts, p, col = RED, w = 10) {
  ink(pts, p, { w, col, amp: 1 });
  if (p >= 1 && pts.length >= 2) {
    const n = pts.length;
    const a = pts[n - 1];
    const b = n >= 3 ? pts[n - 3] : pts[n - 2];
    const ang = Math.atan2(a[1] - b[1], a[0] - b[0]);
    ink([[a[0] - Math.cos(ang - 0.5) * 34, a[1] - Math.sin(ang - 0.5) * 34], a, [a[0] - Math.cos(ang + 0.5) * 34, a[1] - Math.sin(ang + 0.5) * 34]], 1, {
      w, col, amp: 0.6
    });
  }
}

// ───────── BibleProject Realistic Characters (Daniel, Lions, Darius)
function drawDanielRealistic(p, pose = 'pray') {
  if (p <= 0) return;
  c.save();

  if (pose === 'pray') {
    // ── KNEELING PRAYER POSE (무릎 꿇은 자세)
    // 1. Lower Robe & Folded Knees (접힌 무릎과 바닥에 퍼진 로브)
    const lowerBody = cat(
      Lp(-50, 0, 70, 0, 8),          // Ground contact
      Cp([70, 0], [60, -45], [40, -80], [20, -110], 12),  // Thigh & hip
      Lp([20, -110], [-45, -100], 6), // Waist line
      Cp([-45, -100], [-70, -70], [-80, -35], [-50, 0], 14) // Calf & heel
    );
    fillP(lowerBody, TONE2, prog(p, 0.1, 0.45) * 0.9);
    ink(lowerBody, prog(p, 0, 0.4), { w: 5.5 });
    hatch(lowerBody, -80, -110, 70, 0, 18, prog(p, 0.3, 0.6), { w: 2.2, col: TONE });

    // Feet & Sandal detail
    ink(Lp(-65, -15, -78, -5, 3), prog(p, 0.2, 0.5), { w: 4, col: INK });

    // 2. Torso & Sash (상체와 허리띠)
    const torso = cat(
      Lp(-45, -100, 20, -110, 6),
      Cp([20, -110], [28, -150], [25, -190], [10, -210], 12),  // Chest & front
      Lp([10, -210], [-35, -205], 6),                           // Neckline
      Cp([-35, -205], [-55, -165], [-58, -130], [-45, -100], 12) // Slanted back
    );
    fillP(torso, TONE2, prog(p, 0.2, 0.5) * 0.95);
    ink(torso, prog(p, 0.15, 0.5), { w: 5 });

    // Red Sash (허리띠 매듭)
    const sash = [[-46, -108], [22, -118], [18, -132], [-48, -122]];
    fillP(sash, RED, prog(p, 0.3, 0.6));
    ink(sash, prog(p, 0.3, 0.6), { w: 3.5, close: true });
    // Hanging sash ribbon
    ink(Cp([-15, -110], [-10, -80], [-25, -50], [-20, -30], 8), prog(p, 0.4, 0.7), { w: 4.5, col: RED });

    // 3. Folded Arms & Hands (모아쥔 기도 손)
    // Left upper arm & sleeve
    const sleeve = cat(
      Cp([-35, -200], [-10, -170], [15, -170], [25, -155], 10),
      Lp([25, -155], [10, -130], 4),
      Cp([10, -130], [-15, -145], [-35, -165], [-45, -180], 10)
    );
    fillP(sleeve, PAPERL, prog(p, 0.3, 0.6));
    ink(sleeve, prog(p, 0.3, 0.6), { w: 4.5 });

    // Two Hands Clasped Together (섬세한 손가락 관절 묘사)
    const hands = [[22, -150], [36, -165], [42, -180], [35, -190], [24, -175], [18, -155]];
    fillP(hands, PAPERL, prog(p, 0.4, 0.7));
    ink(hands, prog(p, 0.4, 0.7), { w: 3.5 });
    // Fingers line
    ink(Lp(32, -168, 38, -182, 3), prog(p, 0.5, 0.8), { w: 2 });
    ink(Lp(26, -162, 32, -176, 3), prog(p, 0.5, 0.8), { w: 2 });

    // 4. Head, Turban & Flowing Beard (사실적인 두상과 수염)
    // Headcloth base (터번)
    const turban = cat(
      Cp([-38, -205], [-42, -245], [-20, -270], [5, -265], 12),
      Cp([5, -265], [22, -260], [26, -240], [18, -225], 10),
      Lp([18, -225], [-38, -205], 6)
    );
    fillP(turban, PAPERL, prog(p, 0.3, 0.6));
    ink(turban, prog(p, 0.3, 0.6), { w: 5 });
    // Turban Agel Cord (머리띠)
    ink(Cp([-35, -240], [-10, -248], [15, -242], [24, -235], 10), prog(p, 0.4, 0.7), { w: 5, col: RED });

    // Face Profile (이목구비: 이마, 오뚝한 콧날, 입술)
    const faceProfile = [
      [8, -240], [18, -240], [24, -228], [17, -224], [22, -216], [14, -214]
    ];
    ink(faceProfile, prog(p, 0.45, 0.75), { w: 3.5 });

    // Calm reverent eye (차분한 눈썹과 감은 눈)
    ink(Lp(6, -234, 14, -232, 3), prog(p, 0.5, 0.8), { w: 3 }); // Eyebrow
    ink(Ap(10, -228, 4, 0.2, Math.PI - 0.2, 6), prog(p, 0.55, 0.85), { w: 2.5 }); // Closed eyelid

    // Flowing White/Gray Beard (결이 살아있는 긴 수염)
    const beard = cat(
      Lp(14, -214, 22, -216, 3),
      Cp([22, -216], [28, -170], [20, -135], [5, -120], 14),
      Cp([5, -120], [-10, -125], [-25, -145], [-28, -175], 12),
      Lp([-28, -175], [5, -210], 6)
    );
    fillP(beard, INK, prog(p, 0.4, 0.7));
    ink(beard, prog(p, 0.4, 0.7), { w: 4.5 });
    // Beard Strands (수염 결 펜선)
    for (let k = 0; k < 5; k++) {
      const u = k / 4;
      ink(Cp([lerp(12, -20, u), -200], [lerp(18, -10, u), -165], [lerp(12, -5, u), -145], [lerp(2, -8, u), -125], 8),
        prog(p, 0.55 + k * 0.05, 0.85 + k * 0.05), { w: 2, col: PAPERL });
    }

  } else {
    // ── UPRIGHT REVERENT / VICTORIOUS POSE (의연한 기립 자세)
    // 1. Long Outer Cloak & Tunic (발목까지 떨어지는 우아한 로브)
    const cloak = cat(
      Lp(-45, 0, 45, 0, 8),
      Cp([45, 0], [42, -90], [38, -180], [28, -240], 16),
      Lp([28, -240], [-28, -240], 6),
      Cp([-28, -240], [-38, -180], [-42, -90], [-45, 0], 16)
    );
    fillP(cloak, TONE2, prog(p, 0.1, 0.45) * 0.9);
    ink(cloak, prog(p, 0, 0.4), { w: 5.5 });
    hatch(cloak, -45, -240, 45, 0, 22, prog(p, 0.3, 0.65), { w: 2, col: TONE });

    // Feet in Sandals
    ink(cat(Lp(-22, 0, -22, 10, 2), Lp(-22, 10, -8, 10, 2)), prog(p, 0.3, 0.6), { w: 3.5 });
    ink(cat(Lp(12, 0, 12, 10, 2), Lp(12, 10, 26, 10, 2)), prog(p, 0.3, 0.6), { w: 3.5 });

    // Inner Fold Curves (옷주름)
    ink(Cp([-10, -230], [-15, -160], [-5, -80], [-12, 0], 14), prog(p, 0.3, 0.7), { w: 3 });
    ink(Cp([15, -220], [10, -150], [20, -70], [18, 0], 14), prog(p, 0.35, 0.75), { w: 3 });

    // Red Sash at Waist
    const sash = [[-34, -135], [34, -135], [32, -150], [-32, -150]];
    fillP(sash, RED, prog(p, 0.3, 0.6));
    ink(sash, prog(p, 0.3, 0.6), { w: 3.5, close: true });
    ink(Lp(-12, -135, -15, -85, 4), prog(p, 0.4, 0.7), { w: 5, col: RED });

    // 2. Arms (한 손은 가슴에, 한 손은 하늘을 향해 평안히 펼침)
    // Left arm to chest
    const lArm = cat(
      Cp([-28, -230], [-45, -195], [-35, -165], [-5, -160], 10),
      Lp([-5, -160], [12, -162], 3)
    );
    fillP(lArm, PAPERL, prog(p, 0.35, 0.65));
    ink(lArm, prog(p, 0.35, 0.65), { w: 4.5 });

    // Right arm raised upward praising God
    const rArm = cat(
      Cp([28, -230], [55, -210], [68, -245], [75, -280], 12),
      Lp([75, -280], [62, -280], 3),
      Cp([62, -280], [52, -245], [42, -215], [20, -205], 10)
    );
    fillP(rArm, PAPERL, prog(p, 0.4, 0.7));
    ink(rArm, prog(p, 0.4, 0.7), { w: 4.5 });
    // Open Hand/Palm
    const handUp = [[62, -280], [68, -305], [78, -302], [75, -280]];
    fillP(handUp, PAPERL, prog(p, 0.5, 0.8));
    ink(handUp, prog(p, 0.5, 0.8), { w: 3 });

    // 3. Head, Turban & Long Venerable Beard
    const turban = cat(
      Cp([-26, -240], [-28, -280], [0, -300], [26, -285], 12),
      Cp([26, -285], [28, -255], [16, -240], [0, -240], 10)
    );
    fillP(turban, PAPERL, prog(p, 0.3, 0.6));
    ink(turban, prog(p, 0.3, 0.6), { w: 5 });
    ink(Cp([-24, -270], [0, -276], [25, -268], [27, -260], 8), prog(p, 0.4, 0.7), { w: 5, col: RED });

    // Face Profile looking up
    fillP(Ap(2, -250, 18, 0, Math.PI * 2, 16), PAPERL, prog(p, 0.35, 0.65));
    // Nose, Eye & Brow
    dot(10, -256, 3.2); // Eye

  [3.6,  1920, 840, 1.32],   // Panel 1: 금령
  [5.2,  1930, 840, 1.35],
  [5.7,  3150, 840, 1.32],   // Panel 2: 투옥
  [7.3,  3160, 845, 1.35],
  [7.8,  3150, 1720, 1.32],  // Panel 3: 입 막으심
  [9.4,  3140, 1720, 1.35],
  [9.9,  1920, 1720, 1.32],  // Panel 4: 새벽 왕
  [11.5, 1910, 1720, 1.35],
  [12.0, 690,  1720, 1.32],  // Panel 5: 영원한 나라
  [13.6, 690,  1715, 1.36],
  [14.3, 1920, 1100, 0.495], // Zoom Out: Full Poster View
  [15.0, 1920, 1100, 0.49]
];

function cam(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const a = KEYS[i], b = KEYS[i + 1];
    if (t <= b[0]) {
      const u = eInOutCubic(prog(t, a[0], b[0]));
      const z = 1 / lerp(1 / a[3], 1 / b[3], u);
      return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z };
    }
  }
  const l = KEYS[KEYS.length - 1];
  return { x: l[1], y: l[2], z: l[3] };
}

// ───────── Frame Function
function frame(t) {
  BF = Math.floor(t * 12); // 12Hz 손맛 지터
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.letterSpacing = '0px';
  c.fillStyle = '#261C14';
  c.fillRect(0, 0, W, H);

  const k = cam(t);
  c.setTransform(k.z, 0, 0, k.z, W / 2 - k.x * k.z, H / 2 - k.y * k.z);

  // Background Kraft Paper
  c.drawImage(paper, PX0, PY0);

  // Title Block
  titleBlock(t);

  // 6 Panels
  for (let i = 0; i < 6; i++) {
    if (t > PN[i].t - 0.3) frameP(i, t);
  }
  panel1(t);
  panel2(t);
  panel3(t);
  panel4(t);
  panel5(t);
  panel6(t);

  // Inter-panel Flow Arrows
  flowArrows(t);

  // Reset to screen coordinates for Vignette & Fades
  c.setTransform(1, 0, 0, 1, 0, 0);
  const vg = c.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.0);
  vg.addColorStop(0, 'rgba(60, 40, 20, 0)');
  vg.addColorStop(1, 'rgba(40, 25, 12, 0.35)');
  c.fillStyle = vg;
  c.fillRect(0, 0, W, H);

  // Fade In
  const fi = 1 - prog(t, 0, 0.3);
  if (fi > 0) {
    c.fillStyle = `rgba(232, 216, 188, ${fi})`;
    c.fillRect(0, 0, W, H);
  }
}

// ── Export Interface
window.renderAt = t => { frame(t); return true; };
window.grab = (t, type = 'image/png', q) => { frame(t); return cv.toDataURL(type, q); };

const CAPTURE = new URLSearchParams(location.search).has('capture');
window.ready = Promise.all(['40px BH', '40px GA', '40px NP'].map(x => document.fonts.load(x, '다니엘'))).then(() => document.fonts.ready).then(() => {
  if (!CAPTURE) {
    const st = performance.now();
    const loop = n => {
      frame(((n - st) / 1000) % DUR);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  return true;
});
</script>
