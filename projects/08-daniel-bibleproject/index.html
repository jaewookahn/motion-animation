<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다니엘 — 바이블프로젝트 잉크 인포그래픽 스타일</title>
<style>
@font-face { font-family: BH; src: url(../../fonts/BlackHanSans-Regular.ttf); }
@font-face { font-family: GA; src: url(../../fonts/Gaegu-Bold.ttf); }
@font-face { font-family: NP; src: url(../../fonts/NanumPenScript-Regular.ttf); }
html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1920, H = 1080, DUR = 15.0;
const INK = '#1C1712', TONE = '#8B8072', TONE2 = '#BCAE96', PAPER = '#E8D8BC', PAPERL = '#F1E6D0', RED = '#B5372A';
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = (x, s = 1.7) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const hr = i => {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
};
let BF = 0;

// ───────── Kraft Paper Texture (World Space Canvas)
const PX0 = -400, PY0 = -400, PW = 4640, PH = 2960;
const paper = document.createElement('canvas');
paper.width = PW; paper.height = PH;
(function() {
  const p = paper.getContext('2d');
  p.fillStyle = PAPER;
  p.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 140; i++) {
    const x = hr(i * 3.1) * PW, y = hr(i * 7.7) * PH, r = 150 + hr(i * 9.9) * 500;
    const g = p.createRadialGradient(x, y, 0, x, y, r);
    const dark = hr(i * 1.7) > 0.5;
    g.addColorStop(0, dark ? 'rgba(150,115,70,.07)' : 'rgba(255,248,230,.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = g;
    p.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  p.lineCap = 'round';
  for (let i = 0; i < 9000; i++) {
    const x = hr(i * 0.37) * PW, y = hr(i * 0.91 + 5) * PH, a = hr(i * 1.3) * Math.PI, l = 4 + hr(i * 2.9) * 16;
    p.strokeStyle = hr(i * 4.1) > 0.5 ? 'rgba(120,88,50,.10)' : 'rgba(255,250,235,.16)';
    p.lineWidth = 1 + hr(i * 5.3) * 1.2;
    p.beginPath(); p.moveTo(x, y); p.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
  for (let i = 0; i < 5000; i++) {
    const x = hr(i * 0.53 + 2) * PW, y = hr(i * 0.77 + 9) * PH;
    p.fillStyle = `rgba(70,48,25,${0.12 + hr(i) * 0.25})`;
    p.fillRect(x, y, 1.6 + hr(i * 3) * 1.6, 1.6 + hr(i * 5) * 1.4);
  }
  for (let i = 0; i < 500; i++) {
    const x = hr(i * 0.61 + 4) * PW, y = hr(i * 0.29 + 1) * PH;
    p.fillStyle = 'rgba(222,178,60,.55)';
    p.beginPath(); p.arc(x, y, 1.5 + hr(i * 7) * 2, 0, 7); p.fill();
  }
})();

// ───────── Point & Curve Generators
function Lp(x1, y1, x2, y2, n = 8) {
  const o = [];
  for (let i = 0; i <= n; i++) o.push([lerp(x1, x2, i / n), lerp(y1, y2, i / n)]);
  return o;
}
function Qp(a, b, e, n = 24) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    o.push([lerp(lerp(a[0], b[0], u), lerp(b[0], e[0], u), u), lerp(lerp(a[1], b[1], u), lerp(b[1], e[1], u), u)]);
  }
  return o;
}
function Cp(a, b, d, e, n = 30) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    o.push([v*v*v*a[0] + 3*v*v*u*b[0] + 3*v*u*u*d[0] + u*u*u*e[0], v*v*v*a[1] + 3*v*v*u*b[1] + 3*v*u*u*d[1] + u*u*u*e[1]]);
  }
  return o;
}
function Ap(cx, cy, r, a0, a1, n = 40, ry) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const a = lerp(a0, a1, i / n);
    o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * (ry ?? r)]);
  }
  return o;
}
function Rp(x, y, w, h) {
  return [...Lp(x, y, x + w, y, 10), ...Lp(x + w, y, x + w, y + h, 8).slice(1), ...Lp(x + w, y + h, x, y + h, 10).slice(1), ...Lp(x, y + h, x, y, 8).slice(1)];
}
const cat = (...a) => a.reduce((o, p) => o.concat(o.length ? p.slice(1) : p), []);

// ───────── Ink Primitives (with 12Hz Handcrafted Boil)
function jit(i, seed, amp) {
  return [(hr(i * 12.99 + seed * 78.23 + BF * 37.7) - 0.5) * 2 * amp, (hr(i * 39.35 + seed * 11.13 + BF * 71.3) - 0.5) * 2 * amp];
}
function jp(pts, seed, amp) {
  return pts.map((q, i) => {
    const j = jit(i, seed, amp);
    return [q[0] + j[0], q[1] + j[1]];
  });
}
function ink(pts, p, o = {}) {
  if (p <= 0 || pts.length < 2) return;
  const w = o.w ?? 5, amp = o.amp ?? 1.3, seed = o.seed ?? (pts[0][0] * 0.13 + pts[0][1] * 0.71);
  const P = jp(pts, seed, amp);
  if (o.close) P.push(P[0]);
  let L = 0;
  const d = [];
  for (let i = 1; i < P.length; i++) {
    const s = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
    d.push(s); L += s;
  }
  let lim = L * clamp(p);
  c.beginPath();
  c.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && lim > 0; i++) {
    if (d[i - 1] <= lim) {
      c.lineTo(P[i][0], P[i][1]);
      lim -= d[i - 1];
    } else {
      const u = lim / d[i - 1];
      c.lineTo(lerp(P[i - 1][0], P[i][0], u), lerp(P[i - 1][1], P[i][1], u));
      lim = 0;
    }
  }
  c.lineWidth = w;
  c.strokeStyle = o.col ?? INK;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.stroke();
}
function fillP(pts, col, a = 1, o = {}) {
  if (a <= 0) return;
  const P = jp(pts, o.seed ?? (pts[0][0] * 0.31 + pts[0][1] * 0.17), o.amp ?? 1.1);
  c.save();
  c.globalAlpha *= a;
  c.beginPath();
  c.moveTo(P[0][0], P[0][1]);
  for (const q of P) c.lineTo(q[0], q[1]);
  c.closePath();
  c.fillStyle = col;
  c.fill();
  c.restore();
}
function hatch(clipPts, x0, y0, x1, y1, sp, p, o = {}) {
  c.save();
  c.beginPath();
  c.moveTo(clipPts[0][0], clipPts[0][1]);
  for (const q of clipPts) c.lineTo(q[0], q[1]);
  c.closePath();
  c.clip();
  const n = Math.ceil((x1 - x0 + (y1 - y0)) / sp);
  const k = Math.floor(n * clamp(p));
  for (let i = 0; i < k; i++) {
    const x = x0 + i * sp;
    ink(Lp(x, y0, x - (y1 - y0) * (o.slant ?? 0.6), y1, 3), 1, {
      w: o.w ?? 2.4, col: o.col ?? INK, amp: 0.9, seed: i * 3.3 + x0
    });
  }
  c.restore();
}
function dot(x, y, r, col = INK) {
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = col;
  c.fill();
}
function wipe(x, y, w, h, p, fn) {
  if (p <= 0) return;
  c.save();
  c.beginPath();
  c.rect(x, y, w * p, h);
  c.clip();
  fn();
  c.restore();
}
function hand(str, x, y, size, p, o = {}) {
  c.save();
  c.font = `${size}px ${o.font ?? 'NP'}`;
  c.textBaseline = 'alphabetic';
  c.textAlign = 'left';
  const w = c.measureText(str).width;
  const x0 = o.align === 'center' ? x - w / 2 : x;
  wipe(x0 - 10, y - size * 1.05, w + 20, size * 1.45, p, () => {
    c.fillStyle = o.col ?? INK;
    c.fillText(str, x0, y);
  });
  c.restore();
  return w;
}
function lettering(str, x, y, size, t0, t, o = {}) {
  c.save();
  c.font = `${size}px BH`;
  c.textBaseline = 'alphabetic';
  c.letterSpacing = (o.ls ?? 4) + 'px';
  const chars = [...str];
  let acc = '';
  const tot = c.measureText(str).width;
  const x0 = o.align === 'center' ? x - tot / 2 : x;
  chars.forEach((ch, i) => {
    const cx = c.measureText(acc).width;
    acc += ch;
    const cw = c.measureText(ch).width;
    const p = eOutBack(prog(t, t0 + i * (o.st ?? 0.09), t0 + i * (o.st ?? 0.09) + 0.3), 2.2);
    if (p <= 0) return;
    const j = jit(i, BF * 0.1 + i, 1.6);
    c.save();
    c.translate(x0 + cx + cw / 2 + j[0], y - size * 0.35 + j[1]);
    c.rotate((hr(i * 5.5) - 0.5) * 0.07);
    c.scale(p, p);
    c.translate(-cw / 2, size * 0.35);
    const sd = size * 0.055;
    c.fillStyle = INK;
    c.fillText(ch, sd, sd);
    c.fillStyle = o.fill ?? PAPERL;
    c.fillText(ch, 0, 0);
    c.lineWidth = size * 0.035;
    c.strokeStyle = INK;
    c.lineJoin = 'round';
    c.strokeText(ch, 0, 0);
    c.restore();
  });
  c.restore();
}
function ribbon(x, y, w, h, p, str, size = 44) {
  if (p <= 0) return;
  const e = eOutCubic(p);
  const ww = w * e;
  const pts = [[x, y], [x + ww, y], [x + ww - h * 0.28, y + h / 2], [x + ww, y + h], [x, y + h], [x + h * 0.28, y + h / 2]];
  fillP(pts, INK, 1, { seed: x * 0.01 + y, amp: 1 });
  c.save();
  c.beginPath();
  c.rect(x, y, ww, h);
  c.clip();
  c.font = `${size}px GA`;
  c.fillStyle = PAPERL;
  c.textBaseline = 'middle';
  c.fillText(str, x + h * 0.55, y + h / 2 + 3);
  c.restore();
}
function badge(x, y, r, n, p) {
  const s = eOutBack(p, 2.4);
  if (s <= 0) return;
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  fillP(Ap(0, 0, r, 0, Math.PI * 2, 30), INK, 1, { seed: n });
  c.font = `${r * 1.2}px BH`;
  c.fillStyle = PAPERL;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(n, 0, r * 0.08);
  c.restore();
}
function arrow(pts, p, col = RED, w = 10) {
  ink(pts, p, { w, col, amp: 1 });
  if (p >= 1 && pts.length >= 2) {
    const n = pts.length;
    const a = pts[n - 1];
    const b = n >= 3 ? pts[n - 3] : pts[n - 2];
    const ang = Math.atan2(a[1] - b[1], a[0] - b[0]);
    ink([[a[0] - Math.cos(ang - 0.5) * 34, a[1] - Math.sin(ang - 0.5) * 34], a, [a[0] - Math.cos(ang + 0.5) * 34, a[1] - Math.sin(ang + 0.5) * 34]], 1, {
      w, col, amp: 0.6
    });
  }
}

// ───────── Character System (BibleProject-style figures)
// 실루엣은 SVG 패스 문법(M/L/C/Q/Z, 절대좌표)으로 저작 → 점 배열로 변환해 잉크 지터를 그대로 적용.
// 모든 인물은 오른쪽을 바라보는 기준으로 설계. 왼쪽을 보게 하려면 scale(-1,1).
const SKIN = '#E6CDAA', BEARD_W = '#ECE6DA', ROBE_D = '#4A2E2A', ROBE_M = '#5E5348';
const SLATE = '#7D8A8C', SAGE = '#99A083', OCHRE = '#C49A5A', CREAM = '#E7D9BE';
const _svc = new Map();
function svc(d, n = 10) {
  if (_svc.has(d)) return _svc.get(d);
  const tk = d.match(/[MLCQZ]|-?\d*\.?\d+/g);
  let i = 0, cur = [0, 0], st = null, cmd = 'M';
  const out = [], num = () => parseFloat(tk[i++]);
  while (i < tk.length) {
    if (/[MLCQZ]/.test(tk[i])) cmd = tk[i++];
    if (cmd === 'M') { cur = [num(), num()]; st = cur; out.push(cur); cmd = 'L'; }
    else if (cmd === 'L') { const e = [num(), num()]; out.push(...Lp(cur[0], cur[1], e[0], e[1], 3).slice(1)); cur = e; }
    else if (cmd === 'C') { const a = [num(), num()], b = [num(), num()], e = [num(), num()]; out.push(...Cp(cur, a, b, e, n).slice(1)); cur = e; }
    else if (cmd === 'Q') { const a = [num(), num()], e = [num(), num()]; out.push(...Qp(cur, a, e, n).slice(1)); cur = e; }
    else if (cmd === 'Z') { if (st) out.push(...Lp(cur[0], cur[1], st[0], st[1], 3).slice(1)); cur = st; }
  }
  _svc.set(d, out);
  return out;
}
// 채움 + 외곽선 (p 구간 a0→a1 동안 선이 그려지고 면이 차오름)
function S(d, fill, p, a0 = 0, a1 = 1, o = {}) {
  const q = prog(p, a0, a1); if (q <= 0) return;
  const pts = svc(d);
  if (fill) fillP(pts, fill, clamp(q * 1.6 - 0.3), { amp: o.amp ?? 0.7, seed: o.seed });
  if (o.w !== 0) ink(pts, q, { w: o.w ?? 4, amp: o.amp ?? 0.7, col: o.col, seed: o.seed });
}
// 선만
function Ln(d, p, a0 = 0, a1 = 1, o = {}) {
  const q = prog(p, a0, a1); if (q <= 0) return;
  ink(svc(d), q, { w: o.w ?? 2.5, amp: o.amp ?? 0.6, col: o.col, seed: o.seed });
}
// 도형 안쪽 일부에만 해칭 (그림자)
function shade(d, rect, p, a0, a1, o = {}) {
  const q = prog(p, a0, a1); if (q <= 0) return;
  const pts = svc(d);
  c.save(); c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const v of pts) c.lineTo(v[0], v[1]); c.closePath(); c.clip();
  const [x, y, w, h] = rect;
  hatch(Rp(x, y, w, h), x, y, x + w + h, y + h, o.sp ?? 11, q, { w: o.w ?? 1.6, col: o.col ?? INK, slant: o.slant ?? 0.7 });
  c.restore();
}

// ── 머리 (원점 = 목 위 중앙, 오른쪽을 바라봄, 높이 약 86)
// o: { p, wear:'turban'|'crown'|'cap', capCol, beard:'white'|'persian'|'short', eye:'closed'|'open'|'wide'|'sly', mouth:'open' }
function head(o = {}) {
  const p = o.p ?? 1;
  // 뒤로 늘어지는 머릿수건 / 페르시아식 뒷머리
  if (o.wear === 'turban') S('M -20 -50 C -34 -40 -38 -12 -33 8 L -12 8 C -16 -10 -15 -30 -8 -44 Z', TONE2, p, 0.05, 0.45, { w: 3.5 });
  if (o.beard === 'persian') {
    S('M -12 -44 C -36 -40 -42 -8 -28 6 C -16 14 -4 6 -6 -8 Z', INK, p, 0.05, 0.45, { w: 3 });
    [[-26, -26], [-30, -12], [-18, -4], [-22, -36]].forEach(([x, y], k) => Ln(`M ${x - 4} ${y} Q ${x} ${y - 6} ${x + 4} ${y}`, p, 0.45 + k * 0.03, 0.7, { w: 2, col: PAPERL }));
  }
  // 얼굴 옆선: 이마 → 콧대 → 코끝 → 인중 → 입술 → 턱 → 목
  const FACE = 'M -14 0 C -26 -10 -30 -40 -24 -58 C -16 -74 6 -76 16 -64 C 20 -58 21 -50 20 -44 L 23 -40 L 30 -30 L 24 -27 L 24 -22 L 22 -19 C 24 -14 20 -6 12 -4 C 6 -2 4 0 2 2 Z';
  S(FACE, SKIN, p, 0.1, 0.5, { w: 4 });
  // 귀
  S('M -7 -43 C -14 -43 -15 -28 -8 -27 C -3 -29 -3 -40 -7 -43 Z', SKIN, p, 0.35, 0.55, { w: 2.5 });
  Ln('M -8 -39 C -11 -37 -11 -33 -8 -31', p, 0.45, 0.6, { w: 1.6 });
  // 눈 + 눈썹
  const eye = o.eye ?? 'open';
  if (eye === 'closed') { Ln('M 9 -44 Q 13 -41 18 -44', p, 0.45, 0.65, { w: 2.6 }); Ln('M 7 -51 Q 13 -54 19 -50', p, 0.45, 0.65, { w: 3 }); }
  if (eye === 'open') { Ln('M 9 -45 Q 13 -48 18 -45', p, 0.45, 0.65, { w: 2.4 }); if (prog(p, 0.55, 0.6) > 0) dot(14, -44, 2.3); Ln('M 7 -51 Q 13 -54 19 -51', p, 0.45, 0.65, { w: 3 }); }
  if (eye === 'wide') { S('M 8 -45 Q 13 -51 19 -45 Q 13 -40 8 -45 Z', PAPERL, p, 0.45, 0.6, { w: 2.2 }); if (prog(p, 0.55, 0.6) > 0) dot(14.5, -45, 2.5); Ln('M 5 -51 Q 12 -55 19 -57', p, 0.45, 0.65, { w: 3 }); Ln('M 9 -40 Q 13 -38 17 -40', p, 0.5, 0.65, { w: 1.4 }); }
  if (eye === 'sly') { Ln('M 9 -45 L 18 -46', p, 0.45, 0.6, { w: 2.6 }); if (prog(p, 0.55, 0.6) > 0) dot(14, -44, 2); Ln('M 6 -54 Q 13 -52 19 -48', p, 0.45, 0.65, { w: 3.2 }); }
  // 수염
  const beard = o.beard ?? 'white';
  if (beard === 'white') {
    const B = 'M -6 -32 C 0 -24 12 -24 24 -22 L 24 -16 C 29 -2 27 20 16 42 C 9 48 1 42 -3 30 C -8 14 -10 -8 -8 -22 Z';
    S(B, BEARD_W, p, 0.35, 0.7, { w: 3.2 });
    [[18, -14, 10, 36], [10, -16, 4, 38], [2, -18, -2, 30], [-4, -20, -6, 18]].forEach(([x0, y0, x1, y1], k) =>
      Ln(`M ${x0} ${y0} C ${x0 + 2} ${y0 + 16} ${x1 + 3} ${y1 - 14} ${x1} ${y1}`, p, 0.55 + k * 0.04, 0.85, { w: 1.6, col: TONE }));
    Ln('M 25 -24 C 21 -21 17 -21 12 -22', p, 0.6, 0.8, { w: 2.2 });
  }
  if (beard === 'persian') {
    const B = 'M -4 -30 C 6 -22 16 -22 24 -18 L 24 -14 C 27 2 25 28 21 46 L 1 46 C -5 30 -8 2 -6 -24 Z';
    S(B, INK, p, 0.35, 0.7, { w: 3 });
    for (let r = 0; r < 4; r++) for (let k = 0; k < 3; k++) {
      const x = 3 + k * 7 + (r % 2) * 3, y = -6 + r * 12;
      Ln(`M ${x - 3} ${y} Q ${x} ${y - 5} ${x + 3} ${y}`, p, 0.6 + r * 0.04, 0.85, { w: 1.6, col: PAPERL });
    }
  }
  if (beard === 'short') {
    S('M -4 -28 C 6 -22 18 -22 24 -18 L 24 -14 C 24 -2 20 10 12 18 C 4 14 -4 2 -6 -20 Z', INK, p, 0.35, 0.65, { w: 3 });
  }
  if (o.mouth === 'open' && prog(p, 0.65, 0.7) > 0) fillP(svc('M 19 -21 L 27 -20 L 25 -14 L 19 -16 Z'), INK, 1, { amp: 0.4 });
  // 머리쓰개
  if (o.wear === 'turban') {
    S('M -27 -42 C -35 -64 -18 -87 4 -87 C 22 -87 29 -72 22 -55 C 8 -59 -10 -55 -22 -48 Z', PAPERL, p, 0.2, 0.55, { w: 3.5 });
    Ln('M -26 -60 C -10 -70 8 -73 23 -66', p, 0.45, 0.65, { w: 1.8 });
    Ln('M -21 -72 C -6 -81 10 -81 20 -77', p, 0.5, 0.7, { w: 1.8 });
    Ln('M -24 -50 C -8 -56 8 -59 22 -57', p, 0.55, 0.75, { w: 5, col: RED });
  }
  if (o.wear === 'crown') {
    S('M -24 -50 L -22 -96 L -15 -96 L -15 -88 L -7 -88 L -7 -103 L 1 -103 L 1 -88 L 9 -88 L 9 -96 L 16 -96 L 20 -58 Z', RED, p, 0.2, 0.55, { w: 3.2 });
    Ln('M -23 -62 L 19 -68', p, 0.5, 0.7, { w: 3, col: PAPERL });

  const P = PN[5], s = P.t;
  if (t < s - 0.3) return;
  c.save(); clipPanel(5); c.translate(P.x, P.y);

  // Ground
  ink(Lp(40, 700, 1140, 700, 24), prog(t, s + 0.05, s + 0.35), { w: 4 });

  // Daniel Unharmed Standing Victorious
  c.save();
  c.translate(330, 700);
  c.scale(0.85, 0.85);
  daniel(prog(t, s + 0.2, s + 0.8), 'raise', { headRot: -0.3 });
  c.restore();

  // Grand Proclamation Decree
  ribbon(480, 220, 580, 72, prog(t, s + 0.3, s + 0.7), '다리오 왕의 전국 조서', 46);

  hand('"그는 살아 계시는 하나님이시요', 520, 360, 52, prog(t, s + 0.5, s + 0.9));
  hand('영원히 변하지 않으실 이시며', 520, 430, 52, prog(t, s + 0.7, s + 1.1));
  hand('그의 나라는 멸망하지 아니할 것이요', 520, 500, 52, prog(t, s + 0.9, s + 1.3), { col: RED });
  hand('그의 권세는 무궁할 것이라"', 520, 570, 52, prog(t, s + 1.1, s + 1.4), { col: RED });
  hand('— 다니엘 6:26', 820, 640, 40, prog(t, s + 1.2, s + 1.5), { col: TONE });

  c.restore();
}

// ───────── Header Title & Flow Arrows
function titleBlock(t) {
  lettering('다니엘', 180, 330, 240, 0.1, t, { st: 0.12, ls: 6 });
  ink(Cp([180, 370], [540, 400], [880, 350], [1220, 380], 36), prog(t, 0.45, 0.8), { w: 7 });
  hand('사자굴과 영원한 하나님의 나라', 1260, 320, 58, prog(t, 0.6, 1.0), { col: INK });

  // Top Right Bible Ref Ribbon
  ribbon(2580, 190, 560, 80, prog(t, 13.6, 14.2), '다니엘 6장 1절 – 28절', 50);
  hand('믿음 · 음모 · 구원', 2620, 345, 58, prog(t, 13.8, 14.5));
}

function flowArrows(t) {
  const A = [
    [Cp([1180, 1060], [1240, 980], [1330, 980], [1400, 1060], 20), 13.8],
    [Cp([2410, 1060], [2470, 980], [2560, 980], [2630, 1060], 20), 13.9],
    [Cp([3620, 1150], [3720, 1240], [3720, 1300], [3640, 1390], 20), 14.0],
    [Cp([2640, 1560], [2580, 1480], [2490, 1480], [2420, 1560], 20), 14.1],
    [Cp([1410, 1560], [1350, 1480], [1260, 1480], [1190, 1560], 20), 14.2]
  ];
  A.forEach(([pts, s]) => arrow(pts, prog(t, s, s + 0.22)));
}

// ───────── Camera Track
const KEYS = [
  [0.0,  760,  300, 1.12],   // Title
  [1.0,  760,  290, 1.17],
  [1.45, 690,  840, 1.32],   // Panel 0: 기도
  [3.1,  700,  840, 1.35],
  [3.6,  1920, 840, 1.32],   // Panel 1: 금령
  [5.2,  1930, 840, 1.35],
  [5.7,  3150, 840, 1.32],   // Panel 2: 투옥
  [7.3,  3160, 845, 1.35],
  [7.8,  3150, 1720, 1.32],  // Panel 3: 입 막으심
  [9.4,  3140, 1720, 1.35],
  [9.9,  1920, 1720, 1.32],  // Panel 4: 새벽 왕
  [11.5, 1910, 1720, 1.35],
  [12.0, 690,  1720, 1.32],  // Panel 5: 영원한 나라
  [13.6, 690,  1715, 1.36],
  [14.3, 1920, 1100, 0.495], // Zoom Out: Full Poster View
  [15.0, 1920, 1100, 0.49]
];

function cam(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const a = KEYS[i], b = KEYS[i + 1];
    if (t <= b[0]) {
      const u = eInOutCubic(prog(t, a[0], b[0]));
      const z = 1 / lerp(1 / a[3], 1 / b[3], u);
      return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z };
    }
  }
  const l = KEYS[KEYS.length - 1];
  return { x: l[1], y: l[2], z: l[3] };
}

// ───────── Frame Function
function frame(t) {
  BF = Math.floor(t * 12); // 12Hz 손맛 지터
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.letterSpacing = '0px';
  c.fillStyle = '#261C14';
  c.fillRect(0, 0, W, H);

  const k = cam(t);
  c.setTransform(k.z, 0, 0, k.z, W / 2 - k.x * k.z, H / 2 - k.y * k.z);

  // Background Kraft Paper
  c.drawImage(paper, PX0, PY0);

  // Title Block
  titleBlock(t);

  // 6 Panels
  for (let i = 0; i < 6; i++) {
    if (t > PN[i].t - 0.3) frameP(i, t);
  }
  panel1(t);
  panel2(t);
  panel3(t);
  panel4(t);
  panel5(t);
  panel6(t);

  // Inter-panel Flow Arrows
  flowArrows(t);

  // Reset to screen coordinates for Vignette & Fades
  c.setTransform(1, 0, 0, 1, 0, 0);
  const vg = c.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.0);
  vg.addColorStop(0, 'rgba(60, 40, 20, 0)');
  vg.addColorStop(1, 'rgba(40, 25, 12, 0.35)');
  c.fillStyle = vg;
  c.fillRect(0, 0, W, H);

  // Fade In
  const fi = 1 - prog(t, 0, 0.3);
  if (fi > 0) {
    c.fillStyle = `rgba(232, 216, 188, ${fi})`;
    c.fillRect(0, 0, W, H);
  }
}

// ── Export Interface
window.renderAt = t => { frame(t); return true; };
window.grab = (t, type = 'image/png', q) => { frame(t); return cv.toDataURL(type, q); };

const CAPTURE = new URLSearchParams(location.search).has('capture');
window.ready = Promise.all(['40px BH', '40px GA', '40px NP'].map(x => document.fonts.load(x, '다니엘').catch(()=>[]))).then(() => document.fonts.ready).then(() => {
  if (!CAPTURE) {
    const st = performance.now();
    const loop = n => {
      frame(((n - st) / 1000) % DUR);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  return true;
});
