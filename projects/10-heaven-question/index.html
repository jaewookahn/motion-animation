  teal:'#4FB3A9',rose:'#D9776B',cold:'#6E7FA6',coldD:'#3A4560',red:'#C8553D',stone:'#2A3150',stoneL:'#3A4268',skin:'#E2AE8A',skinD:'#C99070'};
// ── paint helpers

function rgd(x,y,r,st){const g=c.createRadialGradient(x,y,0,x,y,r);st.forEach(([o,col])=>g.addColorStop(o,col));return g;}
function rr(x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();}
function circ(x,y,r,fill){c.beginPath();c.arc(x,y,Math.max(.1,r),0,Math.PI*2);c.fillStyle=fill;c.fill();}
function ell(x,y,rx,ry,fill,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2);c.fillStyle=fill;c.fill();}

function heart(x,y,s,fill){c.save();c.translate(x,y);c.scale(s,s);c.beginPath();c.moveTo(0,30);c.bezierCurveTo(-60,-10,-30,-60,0,-28);c.bezierCurveTo(30,-60,60,-10,0,30);c.fillStyle=fill;c.fill();c.restore();}
// ── backgrounds

function dust(n,seed,col,a){for(let i=0;i<n;i++){const x=(hr(i+seed)*W+T*12*(hr(i+7)-.5)*4+W)%W,y=(hr(i*2.3+seed)*H-T*10*(.3+hr(i+1))+H*4)%H;circ(x,y,1.2+hr(i+4)*2.4,col.replace('A',(a*(.3+.7*hr(i+8))).toFixed(3)));}}

// ── people (adult, modern) feet at (0,0), facing right
function person(o){
  const s=o.s||1;c.save();c.translate(o.x,o.y);c.scale((o.flip?-1:1)*s,s);c.globalAlpha*=o.a??1;
  const L=o.light;const skin=L?'#FFF6E2':(o.skin||K.skin),shirt=L?'#FFF0CC':(o.shirt||'#3C7D8C'),pants=L?'#FFE2A6':(o.pants||'#262C46'),hair=L?'#FFF6E2':(o.hair||'#2A2026');

  const leg=(x,ang)=>{c.save();c.translate(x,-92);c.rotate(ang);rr(-11,0,22,90,10,pants);ell(5,90,15,7,L?'#FFE2A6':'#1A1A24');c.restore();};
  if(sit){rr(-16,-58,74,26,12,pants);rr(36,-56,22,58,10,pants);ell(52,2,15,7,'#1A1A24');}
  else{const sw=walk?Math.sin(ph)*.38:0;leg(-10,sw);leg(10,-sw);}
  if(o.robe){c.fillStyle=lg(0,-180,0,0,[[0,o.robe],[1,mixC(o.robe,'#000000',.3)]]);c.beginPath();c.moveTo(-34,-176);c.lineTo(-46,-2);c.lineTo(46,-2);c.lineTo(34,-176);c.fill();}

  const back=o.arms||(walk?'swing':pose);

  else if(back==='swing'){const sw=Math.sin(ph)*24;arm(-18,sy,-22-sw*.5,sy+40,-24-sw,sy+76);}
  else if(back==='up')arm(-22,sy,-46,sy-40,-58,sy-92);
  else arm(-20,sy,-26,sy+40,-28,sy+80);
  c.save();c.beginPath();c.roundRect(-34,-178+oy,68,96,[26,26,12,12]);c.clip();
  c.fillStyle=lg(0,-178+oy,0,-82+oy,[[0,shirt],[1,mixC(shirt,'#000000',.28)]]);c.fillRect(-34,-178+oy,68,96);
  c.fillStyle='rgba(255,255,255,.10)';c.fillRect(-28,-170+oy,10,80);c.fillStyle='rgba(0,0,0,.14)';c.fillRect(22,-178+oy,12,96);

  if(o.chestLight){const p=.75+.25*Math.sin(T*2.4);glow(6,-142+oy,70*p*o.chestLight,'rgba(255,214,140,.9)');circ(6,-142+oy,7*o.chestLight,'#FFF2CE');}

  if(!L){const ex=o.look??4;ell(8+ex,-5,3.4,4.6,'#161320');ell(22+ex,-5,3.2,4.4,'#161320');
    c.strokeStyle=mixC(hair,'#000000',.1);c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(3+ex,-14+(o.brow||0));c.lineTo(12+ex,-15);c.moveTo(18+ex,-15);c.lineTo(27+ex,-14+(o.brow||0));c.stroke();

function bust(x,y,r,o){c.save();c.translate(x,y);

// ── UI: chapter header, quote cards, captions, callouts
function chapter(n,title,u){

  c.font=F(800,120);c.fillStyle=K.gold;c.textAlign=al;c.fillText(n,ox,-10);
  c.font=F(700,72);c.fillStyle=K.cream;c.fillText(title,ox,90);

function quote(lines,attr,x,y,w,a,o={}){
  if(a<=0)return;const size=o.size||38,lh=size*1.42;const h=44+lines.length*lh+(attr?48:6);

  c.restore();return h;

function caption(s,a,y=995){if(a<=0)return;c.save();c.globalAlpha=a;c.font=F(600,34);const w=c.measureText(s).width+72;rr(W/2-w/2,y-36,w,72,36,'rgba(8,10,26,.78)');
  c.fillStyle=K.cream;c.textAlign='center';c.textBaseline='middle';c.fillText(s,W/2,y+1);c.restore();}
function callout(px,py,dx,dy,t1,t2,a){if(a<=0)return;c.save();c.globalAlpha=a;const ex=px+dx*a,ey=py+dy*a;
  circ(px,py,7,K.cream);line([[px,py],[ex,ey]],2.5,K.cream);c.font=F(700,30);const w1=c.measureText(t1).width;c.font=F(500,22);const w2=t2?c.measureText(t2).width:0;const w=Math.max(w1,w2)+40,h=t2?84:56;

// ── props
function planet(cx,cy,r,top,bot,u){

  c.fillStyle=lg(0,cy-r,0,cy+r*.2,[[0,top],[1,bot]]);c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();

function goldenCity(x,y,s,a){if(a<=0)return;c.save();c.globalAlpha*=a;c.translate(x,y);c.scale(s,s);glow(0,-40,420,'rgba(255,210,130,.45)');

// ═════════════ SCENES
let T=0;
function sIntro(u){
  bg(K.night0,'#1A2142',1,1);
  const push=1+.06*eSine(prog(u,0,7.5));c.save();c.translate(W/2,H/2);c.scale(push,push);c.translate(-W/2,-H/2);
  glow(1450,380,500,'rgba(90,110,200,.18)');
  // question-mark constellation
  const Q=[[1340,250],[1410,205],[1495,215],[1545,275],[1530,345],[1470,395],[1445,455],[1445,520]];const dot_=[1445,600];
